<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Agregar mi reseña</title>
</head>

<body>

<!------------------------------------------------------------------------------------------->
    <!-- CONTENEDOR GENERAL -->
    <div>
        <!-- MAIN -->
        <main>

            <!-- BLOQUE SUPERIOR (info película + título) -->
            <section>

                <!-- Información de la película -->
                <div>
                    <img src="../recursos/imagenes/peliculas/f1Pelicula.jpg" alt="F1 The Movie" width="250" height="220">

                    <div>
                        <h3>F1 THE MOVIE</h3>
                        <p>8 • 2025 • 2h 35min</p>
                    </div>
                </div>

                <!-- Título sección -->
                <div>
                    <h2>MI RESEÑA</h2>
                </div>

                <!-- Puntuación -->
                <div>
                    <p>Tu puntuación</p>
                    <span>★ ★ ★ ★ ★ ★ ★ ★ ☆ ☆</span>
                </div>

            </section>

            <!-- FORMULARIO -->
            <section>

                <form>

                    <!-- Título reseña -->
                    <div>
                        <input type="text" size="60" placeholder="Título de la reseña (opcional)">
                    </div>

                    <!-- Contenido reseña -->
                    <div>
                        <textarea rows="12" cols="70" placeholder="Escribe tu reseña..."></textarea>
                    </div>

                    <!-- Contador -->
                    <p>0/1000</p>

                    <!-- Botones -->
                    <div>
                        <button type="submit">Publicar Reseña</button>
                        <button type="button">Cancelar</button>
                    </div>

                </form>

            </section>

        </main>

    </div>
<!------------------------------------------------------------------------------------------->

</body>
</html>
