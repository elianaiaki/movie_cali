<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Editar mi perfil</title>
</head>

<body>

    <section>

        <!-- Título -->
        <h1>Editar mi perfil</h1>

        <!-- Volver -->
        <a href="../mi_perfil.html">Volver</a>

        <!-- Imagen de perfil -->
        <div>
            <img src="../../recursos/imagenes/iconos/perfil.png" alt="Foto de perfil" width="150">
            <button type="button">Cambiar foto</button>
        </div>

        <!-- Formulario -->
        <form>

            <h2>Información personal</h2>

            <!-- Usuario -->
            <div>
                <label>Nombre de usuario</label><br>
                <input type="text">
            </div>

            <!-- Email -->
            <div>
                <label>Email</label><br>
                <input type="email">
            </div>

            <!-- Contraseña -->
            <div>
                <label>Contraseña</label><br>
                <input type="password">
            </div>

            <!-- Confirmar contraseña -->
            <div>
                <label>Confirmar contraseña</label><br>
                <input type="password">
            </div>

            <!-- Biografía -->
            <div>
                <label>Biografía</label><br>
                <textarea></textarea>
            </div>

            <!-- Géneros favoritos -->
            <div>
                <label>Géneros favoritos</label><br>

                <input type="checkbox"> Acción
                <input type="checkbox"> Comedia
                <input type="checkbox"> Drama
                <input type="checkbox"> Terror
                <input type="checkbox"> Ciencia ficción
            </div>

            <!-- Botones -->
            <div>
                <button type="submit">Guardar cambios</button>
                <a href="../mi_perfil.html">Cancelar</a>
            </div>

        </form>

    </section>
 
</body>
</html>
