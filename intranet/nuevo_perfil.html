<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>NUEVO PERFIL</title>
    <link rel="stylesheet" href="../estilos/estilos_intranet/header_intranet.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/body_intranet.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/panel_intranet.css">
    <link rel="stylesheet" href="../estilos/footer.css">
    
    <script src="../scripts/intranet_scripts/desplegable.js" defer></script>

    <script src="../scripts/validaciones.js"></script><!-- CONEXION CON JS -->

    <script>
        function asociarValidacion(){
            // Obtener formulario
            const formulario = document.getElementById("nuevo_perfil");

            // Evento submit
            formulario.addEventListener("submit", function(event){
                // Frenar envío automático
                event.preventDefault();

                // Obtener valores
                const nombre = document.getElementById("nombre").value;
                const apellido = document.getElementById("apellido").value;
                const correo = document.getElementById("correo").value;
                const identificador = document.getElementById("identificador").value;
                const contrasenia = document.getElementById("contrasenia").value;
                const repetirContrasenia = document.getElementById("repetirContrasenia").value;
                const celular = document.getElementById("celular").value;

                // Validar nombre
                if(!textoAlfabeticoValido(nombre)){
                    alert("Nombre inválido");
                    return;
                }

                // Validar apellido
                if(!textoAlfabeticoValido(apellido)){
                    alert("Apellido inválido");
                    return;
                }

                // Validar correo
                if(!correoValido(correo)){
                    alert("Correo inválido");
                    return;
                }

                // Validar ID
                if(!textoAlfanumericoValido(identificador)){
                    alert("ID inválido");
                    return;
                }

                // Validar contraseña
                if(!contraseniaValida(contrasenia)){
                    alert("Contraseña inválida");
                    return;
                }

                // Validar coincidencia
                if(contrasenia !== repetirContrasenia){
                    alert("Las contraseñas no coinciden");
                    return;
                }

                // Validar celular
                if(!numeroTelefonoValido(celular)){
                    alert("Número de celular inválido");
                    return;
                }

                // Todo correcto
                alert("Perfil creado correctamente");

                // Enviar formulario
                formulario.submit();
            });
        }
    </script>
</head>

<body class="body" onload="asociarValidacion()">
<!---------- INICIO DE HEADER----------------------->
    <!-- HEADER -->
    <header class="header">
        <!-- LOGO -->
        <div class="logo">
            <img src="../recursos/imagenes/logo/logo.png" alt="Logo MovieCali">
        </div>

        <!-- BUSCADOR -->
        <form class="buscador">
            <input type="text" placeholder="Buscar películas, series...">
            <button>🔍</button>
        </form>

        <!-- PERFIL -->
        <div class="perfil" id="perfilBtn">
            <img src="../recursos/imagenes/iconos/usuario.png" alt="usuario">
        <!-- DESPLEGABLE -->
            <div class="desplegable">
                <form>
                    <select name="desplegable" id="desplegable" onchange="navegarMenu(this)">
                        <option value="" selected disabled>Selecciona una opción...</option>
                        <option value="../intranet/mi_perfil.html">Mi perfil</option>
                        <hr>
                        <optgroup label="Gestión de Películas">
                            <option value="../intranet/peliculas_pendientes_de_revision.html">
                                Películas pendientes de revisión
                            </option>
                            <option value="../intranet/nuevas_solicitudes_de_alta_peliculas.html">
                                Nuevas solicitudes de alta
                            </option>
                        </optgroup> 
                        <hr>
                        <optgroup label="Administración Usuarios">
                            <option value="../intranet/gestion_de_perfil_roles.html">
                                Gestión de perfil y roles
                            </option>
                            <option value="../intranet/nuevo_perfil.html">
                                Crear nuevo perfil
                            </option>
                        </optgroup>  
                        <hr>
                        <option value="../intranet/inicio_de_sesion.html">Cerrar Sesión</option>     
                    </select>
                </form>      
            </div> 
        </div>
    </header>
    <hr>
<!-------------FIN DE HEADER---------------------------------------------------->
    <main class="main">
        <div class="contenedor-panel">
            <div class="Panel">
                <img src="../recursos/imagenes/iconos/Home.png" alt="Inicio" width="30" height="30">
                <a href="../intranet/panel.html">PANEL</a>
            </div>
        </div>  
        <br>
        <h2>CREAR NUEVO PERFIL</h2>

        <section>
            <form id="nuevo_perfil" action="../intranet/gestion_de_perfil_roles.html" method="get">
                <div>
                    <label>Nombre:</label>
                    <input type="text" id="nombre" placeholder="Escribe el nombre" required>
                </div>
                <div>
                    <label>Apellido:</label>
                    <input type="text" id="apellido" placeholder="Escribe el apellido" required>
                </div>
                <div>
                    <label>Email:</label>
                    <input type="email" id="correo" placeholder="ejemplo@correo.com" required>
                </div>
                <div>
                    <label>ID:</label>
                    <input type="text" id="identificador" placeholder="12586-id">
                </div>
                <div>
                    <label>Rol:</label>
                    <select>
                        <option>ADMINISTRATIVO</option>
                        <option>USUARIO</option>
                    </select>
                </div>
                <div>
                    <label>Permisos:</label>
                    <select>
                        <option>ADMINISTRADOR</option>
                        <option>USUARIO</option>
                    </select>
                </div>
                <div>
                    <label>Contraseña:</label>
                    <input type="password" id="contrasenia" required>
                </div>
                <div>
                    <label>Repetir Contraseña:</label>
                    <input type="password" id="repetirContrasenia" required>
                </div>
                <div>
                    <label>Celular:</label>
                    <input type="tel" id="celular" placeholder="+549-2705-869344" required>
                </div>

                <div>
                    <button type="submit">Guardar</button>
                    <a href="../intranet/gestion_de_perfil_roles.html">Cancelar</a>
                </div>
            </form>
        </section>
    </main>

    <br><br>

</html>
