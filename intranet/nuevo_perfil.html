<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>NUEVO PERFIL</title>
</head>

<body>

    <!--HEADER-->
    <header>
        <h1>MovieCali</h1>
        <img src="../recursos/imagenes/logo/logo.png" alt="Logo MovieCali" width="500" height="260">

        <!--Buscador-->
        <form>
            <input type="text" placeholder="Buscar películas, series...">
            <button type="submit">Buscar</button>
        </form>

        <!--Navegación Desplegable-->
        <nav>
            <form>
                <label for="desplegable">Menú de Navegación:</label>
                <select name="desplegable" id="desplegable">
                    <option value="mi_perfil">Mi perfil</option>
                    <optgroup label="Gestión de Películas">
                        <option value="peliculas_pendientes">Películas pendientes de revisión</option>
                        <option value="nuevas_solicitudes">Nuevas solicitudes de alta</option>
                    </optgroup>
                    <optgroup label="Administración Usuarios">
                        <option value="gestion_perfiles">Gestión de perfil y roles</option>
                        <option value="nuevo_perfil">Crear nuevo perfil</option>
                    </optgroup>
                    <option value="cerrar_sesion">Cerrar Sesión</option>
                </select>
            </form>
        </nav>
    </header>

    <hr>

    <main> 
        <!--PANEL DE ACCESO RÁPIDO-->
        <nav>
            <table border="1">
                <tr>
                    <td align="center">
                        <img src="../recursos/imagenes/iconos/Home.png" width="30" height="30" alt="Inicio">
                        <a href="../intranet/panel.html">PANEL</a>
                    </td>
                </tr>
            </table>
            <p><strong>GESTIÓN DE REPORTES DE RESEÑAS ▶</strong></p>
        </nav>

        <br>

        <h2>CREAR NUEVO PERFIL</h2>

        <section>
            <!--Formulario-->
            <form>
                <!--Fila 1: Nombre, Apellido, Email-->
                <div>
                    <label>Nombre:</label>
                    <input type="text" placeholder="Escribe el nombre">
                </div>
                <div>
                    <label>Apellido:</label>
                    <input type="text" placeholder="Escribe el apellido">
                </div>
                <div>
                    <label>Email:</label>
                    <input type="email" placeholder="ejemplo@correo.com">
                </div>

                <!--Fila 2: ID, Rol, Permisos-->
                <div>
                    <label>ID:</label>
                    <input type="text" placeholder="ID autogenerado">
                </div>
                <div>
                    <label>Rol:</label>
                    <select>
                        <option>ADMINISTRATIVO</option>
                        <option>USUARIO</option>
                    </select>
                </div>
                <div>
                    <label>Permisos:</label>
                    <select>
                        <option>ADMINISTRADOR</option>
                        <option>USUARIO</option>
                    </select>
                </div>

                <!--Fila 3: Contraseña, Repetir y Celular-->
                <div>
                    <label>Contraseña:</label>
                    <input type="password">
                </div>
                <div>
                    <label>Repetir Contraseña:</label>
                    <input type="password">
                </div>
                <div>
                    <label>Celular:</label>
                    <input type="tel" placeholder="+549-2705-869344">
                </div>

                <!--Botones Guardar y Cancelar-->
                <div>
                    <button type="submit">Guardar</button>
                    
                    <!-- Enlace para volver al Panel -->
                    <a href="../intranet/gestion_de_perfil_roles.html">
                        <button type="button">Cancelar</button>
                    </a>
            </form>
        </section>
    </main>

    <br><br>
    <!------------------------------------------------------------------------------------------->
    <!--FOOTER-->
    <footer>
        <hr>
        <p>Desarrollado por: Gabriel Mayor · Eliana Salvo · Gabriel Ponce · Alan Walker · Gisella Jara · Brenda Pavez</p>
        <p>2026 MovieCali. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
