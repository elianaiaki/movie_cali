<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>NUEVO PERFIL</title>
    <link rel="stylesheet" href="../estilos/estilos_intranet/header_intranet.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/body_intranet.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/panel_intranet.css">
    <link rel="stylesheet" href="../estilos/footer.css">
    
    <link rel="stylesheet" href="../estilos/estilos_intranet/contenedor_tabla_intranet.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/botones.css">

    <script src="../scripts/intranet_scripts/desplegable.js" defer></script>

    <script src="../scripts/validaciones.js"></script>

    <script src="../scripts/intranet_scripts/validacionNuevoPerfil.js"></script>
</head>

<body class="body" onload="asociarValidacion()">
<!---------- INICIO DE HEADER----------------------->
    <!-- HEADER -->
    <header class="header">
        <!-- LOGO -->
        <div class="logo">
            <img src="../recursos/imagenes/logo/logo.png" alt="Logo MovieCali">
        </div>

        <!-- BUSCADOR -->
        <form class="buscador">
            <input type="text" placeholder="Buscar películas, series...">
            <button>🔍</button>
        </form>

        <!-- PERFIL -->
        <div class="perfil" id="perfilBtn">
            <img src="../recursos/imagenes/iconos/usuario.png" alt="usuario">
        <!-- DESPLEGABLE -->
            <div class="desplegable">
                <form>
                    <select name="desplegable" id="desplegable" onchange="navegarMenu(this)">
                        <option value="" selected disabled>Selecciona una opción...</option>
                        <option value="../intranet/mi_perfil.html">Mi perfil</option>
                        <hr>
                        <optgroup label="Gestión de Películas">
                            <option value="../intranet/peliculas_pendientes_de_revision.html">
                                Películas pendientes de revisión
                            </option>
                            <option value="../intranet/nuevas_solicitudes_de_alta_peliculas.html">
                                Nuevas solicitudes de alta
                            </option>
                        </optgroup> 
                        <hr>
                        <optgroup label="Administración Usuarios">
                            <option value="../intranet/gestion_de_perfil_roles.html">
                                Gestión de perfil y roles
                            </option>
                            <option value="../intranet/nuevo_perfil.html">
                                Crear nuevo perfil
                            </option>
                        </optgroup>  
                        <hr>
                        <option value="../intranet/inicio_de_sesion.html">Cerrar Sesión</option>     
                    </select>
                </form>      
            </div> 
        </div>
    </header>
    <hr>
<!-------------FIN DE HEADER---------------------------------------------------->
    <main class="main">
        <div class="contenedor-panel">
            <div class="Panel">
                <img src="../recursos/imagenes/iconos/Home.png" alt="Inicio" width="30" height="30">
                <a href="../intranet/panel.html">PANEL</a>
            </div>
        </div>  
        <br>
        
        <section class="contenedorFormulario">
            <h2>CREAR NUEVO PERFIL</h2>
            <form id="formAgregar" action="../intranet/gestion_de_perfil_roles.html" method="get">
                <div class="grupoCampo">
                    <label>Nombre:</label>
                    <input type="text" id="nombre" name="nombre" class="inputTexto" placeholder="Escribe el nombre" required>
                </div>
                <div class="grupoCampo">
                    <label>Apellido:</label>
                    <input type="text" id="apellido" name="apellido" class="inputTexto" placeholder="Escribe el apellido" required>
                </div>
                <div class="grupoCampo">
                    <label>Email:</label>
                    <input type="email" id="correo" name="correo" class="inputTexto" placeholder="ejemplo@correo.com" required>
                </div>
                <div class="grupoCampo">
                    <label>ID:</label>
                    <input  type="text" id="identificador" name="identificador" class="inputTexto" placeholder="12586-id">
                </div>
                <div class="grupoCampo">
                    <label>Rol:</label>
                    <select class="inputTexto">
                        <option>ADMINISTRATIVO</option>
                        <option>USUARIO</option>
                    </select>
                </div>
                <div class="grupoCampo">
                    <label>Permisos:</label>
                    <select class="inputTexto">
                        <option>ADMINISTRADOR</option>
                        <option>USUARIO</option>
                    </select>
                </div>
                <div class="grupoCampo">
                    <label>Contraseña:</label>
                    <input type="password" id="contrasenia" name="contrasenia" class="inputTexto" required>
                </div>
                <div class="grupoCampo">
                    <label>Repetir Contraseña:</label>
                    <input  id="repetirContrasenia" name="repetirContrasenia" class="inputTexto" type="password" required>
                </div>
                <div class="grupoCampo">
                    <label>Celular:</label>
                    <input type="tel" id="celular" name="celular" class="inputTexto" placeholder="+549-2705-869344" required>
                </div>

                <div class="accionesFormulario" style="grid-column: 1 / -1; display:flex; justify-content:flex-end;">
                    <div class="botones-inferiores" style="justify-content:flex-end;">
                        <button type="submit" class="btn-gris">GUARDAR</button>

                        <a href="../intranet/gestion_de_perfil_roles.html"  class="btn-gris">Cancelar</a>
                    </div>
                </div>
            </form>
        </section>
    </main>

    <br><br>

<!---------------FOOTER--------------------------->
    <!-- FOOTER -->
    <footer class="footer">
        <p class="titulo-footer">
            Desarrollado por:
        </p>
        <p class="nombres-footer">
            Gabriel Mayor - Eliana Salvo - Gabriel Ponce - Alan Walker - Gisella Jara - Brenda Pavez
        </p>
    </footer>

</body>
</html>
