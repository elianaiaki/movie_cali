<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>NUEVO PERFIL - MovieCali</title>
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>MovieCali</h1>
        <!-- Logo -->
        <img src="../recursos/imagenes/logo/logo.png" alt="Logo MovieCali" width="500" height="260">

        <!-- Buscador -->
        <form>
            <input type="text" placeholder="Buscar películas, series...">
            <button>Buscar</button>
        </form>

        <!-- Navegación Desplegable -->
       <nav>
            <form>
                <label for="Desplegable">Desplegable</label>
                    <select name="desplegable" id="desplegable">
                        <option href="../intranet/mi_perfil.html">Mi perfil</option>
                        <optgroup label="Gestion de Peliculas">
                            <option value="peliculas_pendientes" href="../intranet/peliculas_pendientes_de_revision.html">
                                Pelicula pendientes de revision
                            </option>
                            <option label="nuevas_solicitudes_de_alta" href="../intranet/nuevas_solicitudes_de_alta_peliculas.html">
                                Nuevas solicitudes de alta peliculas
                            </option>
                        </optgroup> 
                        <optgroup label="administracion_usuarios">
                            <option label="gestion_perfiles" href="../intranet/gestion_de_perfil_roles.html">
                                Gestion de perfil y roles
                            </option>
                            <option label="nuevo_perfil_intranet" href="../intranet/nuevo_perfil.html">
                                Crear nuevo perfil
                            </option>
                        </optgroup>  
                        <option label="cerrar_sesion" href="../intranet/inicio_de_sesion.html">Cerrar Sesion</option>     

                    </select>
            </form>
       </nav>
    </header> 
    <hr>
    <!-- FIN DE HEADER-->

    <!------------------------------------------------------------------------------------------->
    <main>

        <h2>CREAR NUEVO PERFIL</h2>

        <section>
            <!--Formulario-->
            <form>
                <!--Fila 1: Nombre, Apellido, Email-->
                <div>
                    <label>Nombre:</label>
                    <input type="text" placeholder="Escribe el nombre">
                </div>
                <div>
                    <label>Apellido:</label>
                    <input type="text" placeholder="Escribe el apellido">
                </div>
                <div>
                    <label>Email:</label>
                    <input type="email" placeholder="ejemplo@correo.com">
                </div>

                <!--Fila 2: ID, Rol, Permisos-->
                <div>
                    <label>ID:</label>
                    <input type="text" placeholder="ID autogenerado">
                </div>
                <div>
                    <label>Rol:</label>
                    <select>
                        <option>ADMINISTRATIVO</option>
                        <option>USUARIO</option>
                    </select>
                </div>
                <div>
                    <label>Permisos:</label>
                    <select>
                        <option>ADMINISTRADOR</option>
                        <option>USUARIO</option>
                    </select>
                </div>

                <!--Fila 3: Contraseña, Repetir y Celular-->
                <div>
                    <label>Contraseña:</label>
                    <input type="password">
                </div>
                <div>
                    <label>Repetir Contraseña:</label>
                    <input type="password">
                </div>
                <div>
                    <label>Celular:</label>
                    <input type="tel" placeholder="+549-2705-869344">
                </div>

                <!--Botones Guardar y Cancelar-->
                <div>
                    <button type="submit">Guardar</button>
                    <button type="button">Cancelar</button>
                </div>
            </form>
        </section>
    </main>

    <br><br>
    <!------------------------------------------------------------------------------------------->
    <!-- FOOTER GRUPAL -->
    <footer>
        <hr>
        <p>Desarrollado por: Gabriel Mayor · Eliana Salvo · Gabriel Ponce · Alan Walker · Gisella Jara · Brenda Pavez</p>
        <p>2026 MovieCali. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
