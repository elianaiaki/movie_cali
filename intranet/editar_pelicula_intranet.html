<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>EDITAR PELICULA</title>
    <link rel="stylesheet" href="../estilos/estilos_intranet/header_intranet.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/body_intranet.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/panel_intranet.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/contenedor_tabla_intranet.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/botones.css">
    <link rel="stylesheet" href="../estilos/footer.css">
    <script src="../scripts/intranet_scripts/desplegable.js" defer></script>

    <script src="../scripts/validaciones.js"></script>
    <script src="../scripts/intranet_scripts/validacionesEditarPelicula.js"></script>
</head>

<body onload="asociarValidacion()">
 
<!------------------------------------------------------------------------------------------->
    <!-- HEADER -->
    <header class="header">
        <!-- LOGO -->
        <div class="logo">
            <img src="../recursos/imagenes/logo/logo.png"
                alt="Logo MovieCali">
        </div>

        <!-- BUSCADOR -->
        <form class="buscador">
            <input type="text"
                placeholder="Buscar películas, series...">

            <button>🔍</button>
        </form>

        <!-- PERFIL -->
        <div class="perfil" id="perfilBtn">
            <img src="../recursos/imagenes/iconos/usuario.png" alt="usuario">
        <!-- DESPLEGABLE -->
            <div class="desplegable">
                <form>
                    <select name="desplegable" id="desplegable" onchange="navegarMenu(this)">
                        <option value="" selected disabled>Selecciona una opción...</option>
                        <option value="../intranet/mi_perfil.html">Mi perfil</option>
                        <hr>
                        <optgroup label="Gestión de Películas">
                            <option value="../intranet/peliculas_pendientes_de_revision.html">
                                Películas pendientes de revisión
                            </option>
                            <option value="../intranet/nuevas_solicitudes_de_alta_peliculas.html">
                                Nuevas solicitudes de alta
                            </option>
                        </optgroup> 
                        <hr>
                        <optgroup label="Administración Usuarios">
                            <option value="../intranet/gestion_de_perfil_roles.html">
                                Gestión de perfil y roles
                            </option>
                            <option value="../intranet/nuevo_perfil.html">
                                Crear nuevo perfil
                            </option>
                        </optgroup>  
                        <hr>
                        <option value="../intranet/inicio_de_sesion.html">Cerrar Sesión</option>     
                    </select>
                </form>      
            </div> 
        </div>
        </div>
    </header>

<!-----------------------FIN DE HEADER--------------------------------------------------------->
    <main class="main">
        <div class="contenedor-panel">
            <div class="Panel">
                <img src="../recursos/imagenes/iconos/Home.png" alt="Inicio" width="30" height="30">
                <a href="../intranet/panel.html">PANEL</a>
            </div>
        </div>
<!------------------------------------------------------------------------------------------->
        <div class="contenedorFormulario">
            <h2>+ EDITAR PELÍCULA</h2>
            
            <form id="formAgregar" action="../intranet/peliculas_pendientes_de_revision.html" method="get">
                
                <div class="grupoCampo" action="../intranet/peliculas_pendientes_de_revision.html" method="get">
                    <label for="Seleccionar_titulo_pelicula">Título:</label>
                    <div class="repartoContenedor">
                        <select name="Seleccionar_titulo_pelicula" id="Seleccionar_titulo_pelicula">
                            <optgroup label="Listado de Películas">
                                <option value="El_Yeti">El Yeti</option>
                                <option value="El_sonido_de_la_muerte">El Sonido de la Muerte</option>
                                <option value="Michael">Michael</option>
                                <option value="F1_La_Pelicula">F1 La Película</option>
                            </optgroup>
                        </select>
                        <input type="text" id="titulo_pelicula" class="inputTexto" placeholder="Nuevo título (ej: El Diablo Viste a la Moda 2)" required>
                    </div>
                </div>

                <div class="grupoCampo">
                    <label for="Genero_pelicula">Género:</label>
                    <input type="text" id="genero_pelicula" class="inputTexto" placeholder="Comedia Dramática" required>
                </div>

                <div class="grupoCampo">
                    <label for="Anio_estreno">Año de Estreno:</label>
                    <input type="text" id="anio_estreno" class="inputTexto" placeholder="2026" required>
                </div>

                <div class="grupoCampo">
                    <label for="Duracion_pelicula">Duración:</label>
                    <input type="text" id="duracion_pelicula" class="inputTexto" placeholder="1h 59min" required>
                </div>

                <div class="grupoCampo">
                    <label for="Director">Director:</label>
                    <input type="text" id="director" class="inputTexto" placeholder="Ingrese nombre y apellido" required>
                </div>

                <div class="grupoCampo">
                    <label for="Productor_pelicula">Productor:</label>
                    <input type="text" id="productor_pelicula" class="inputTexto" placeholder="Ingrese nombre y apellido" required>
                </div>

                <div class="grupoCampo">
                    <label for="Calificacion_pelicula">Calificación General:</label>
                    <input type="text" id="calificacion_pelicula" class="inputTexto" placeholder="8.5">
                </div>

                <div class="grupoCampo">
                    <label for="Plataformas_disponibles">Plataformas:</label>
                    <div class="subir-archivo">
                        <input type="file" id="plataformas_disponibles" class="inputTexto" name="plataformas_disponibles" accept="image/*" required>
                    </div>
                </div>

                <div class="grupoCampo">
                    <label for="clasificacion_edad">Clasificación por Edad:</label>
                    <input type="text" id="clasificacion_edad" class="inputTexto" placeholder="+18" required>
                </div>

                <div class="grupoCampo">
                    <label for="Reparto">Reparto:</label>
                    <div class="repartoContenedor">
                        <select name="reparto" id="Reparto">
                            <optgroup label="Listados">
                                <option value="Anne_Hathaway">Anne Hathaway</option>
                            </optgroup>
                        </select>
                        <input type="text" id="nuevosActores" class="inputTexto" placeholder="Agregar nuevos actores">
                    </div>
                </div>

                <div class="grupoCampoCompleto">
                    <label for="sinopsis">Sinopsis:</label>
                    <textarea id="sinopsis" name="sinopsis_peli" rows="4" placeholder="Escribe aquí el resumen de la trama..." required></textarea>
                </div>

                <div class="grupoCampoArchivo">
                    <label for="video-upload">Tráiler:</label>
                    <div class="subir-archivo">
                        <input type="file" id="video-upload" name="video_numero" accept="video/*" required>
                    </div>
                </div>

                <div class="grupoCampoArchivo">
                    <label for="Poster">Cargar Póster:</label>
                    <div class="subir-archivo">
                        <input type="file" id="poster" name="poster_image" accept="image/*" required>
                    </div>
                </div>

                <div class="botones-inferiores">
                    <button type="submit" class="btn-gris">Guardar Cambios</button>
                    <button type="reset" class="btn-gris" onclick="limpiarFormulario()">Restablecer</button>
                    <a href="../intranet/peliculas_pendientes_de_revision.html" class="btn-gris">Volver</a>
                </div>

            </form>
        </div>
    </main>
<!------------------------------------------------------------------------------------------->
    <!-- FOOTER -->
    <footer class="footer">

        <p class="titulo-footer">
            Desarrollado por:
        </p>

        <p class="nombres-footer">
            Gabriel Mayor - Eliana Salvo - Gabriel Ponce - Alan Walker - Gisella Jara - Brenda Pavez
        </p>

    </footer>
</body>
</html>
