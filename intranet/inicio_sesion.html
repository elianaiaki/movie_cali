<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>INICIAR SESIÓN - Intranet</title>
    <link rel="stylesheet" href="../estilos/estilos_intranet/body_intranet.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/header_intranet.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/inicio_intranet.css">
    <link rel="stylesheet" href="../estilos/footer.css">
               <!-- CONEXION CON JS -->
    <script src="../scripts/validaciones.js"></script>
</head>

<body class="body">
    <!-- HEADER -->
    <header class="header">
        <!--LOGO-->
        <div class="logo">
            <img src="../recursos/imagenes/logo/logo.png" alt="Logo MovieCali" width="500" height="260">
        </div>
        
    </header>

   <!-- FIN DE HEADER-->
<!------------------------------------------------------------------------------------------->
    <hr>
    <main class="diseno-login"> 
        <section class="carta-login">
            <h2>INICIO DE SESION</h2>
            <form id="inicio_de_sesion" action="../intranet/panel.html" method="get">

                <!-- Usuario -->
                <div>
                    <label>USUARIO / CORREO ELECTRONICO</label><br>
                    <img src="../recursos/imagenes/iconos/usuario.png" alt="icono usuario" width="20" height="20" style="vertical-align: middle;">
                    <input id="usuario" type="text" name="usuario" required style="width: 250px;">
                </div>
                
                <!-- Contraseña -->
                <div>
                    <label>CONTRASEÑA</label><br>
                    <img src="../recursos/imagenes/iconos/contraseña.webp" alt="icono contraseña" width="20" height="20" style="vertical-align: middle;">
                    <input id="contrasenia" type="password" required style="width: 250px;">
                    <img src="../recursos/imagenes/iconos/mostrar_contraseña.png" alt="ver" width="20" height="20" style="vertical-align: middle; cursor: pointer;">
                </div>
                
                <!-- Olvidaste contraseña -->
                <div class="contenedor-olvido">
                    <a href="#" class="enlace-olvido" >¿OLVIDASTE TU CONTRASEÑA?</a>
                </div>
                
                <!-- Botón Iniciar Sesión -->
                <div class="contenedor-boton">
                    <button type="submit" class="boton-inicio">INICIAR SESION</button>
                </div>

            </form>
        </section>
    </main>

    <!-- FOOTER -->
    <footer class="footer">

        <p class="titulo-footer">
            Desarrollado por:
        </p>

        <p class="nombres-footer">
            Gabriel Mayor - Eliana Salvo - Gabriel Ponce -
            Alan Walker - Gisella Jara - Brenda Pavez
        </p>
    </footer>
 
     <script>

        // Obtener formulario
        const formulario = document.getElementById("inicio_de_sesion");

        // Evento submit
        formulario.addEventListener("submit", function(event){

            // Frenar envío automático
            event.preventDefault();

            // Obtener valores
            const usuario = document.getElementById("usuario").value;

            const contrasenia = document.getElementById("contrasenia").value;

            // Validar usuario o correo
            if(
                !usuarioValido(usuario) &&
                !correoValido(usuario)
            ){

                alert("Usuario o correo inválido");

                return;
            }

            // Validar contraseña
            if(
                !contraseniaValida(contrasenia)
            ){

                alert("Contraseña inválida");

                return;
            }

            // Si todo está bien
            alert("Inicio de sesión correcto");

            // Enviar formulario manualmente
            formulario.submit();

        });

    </script>
</body>
</html>
