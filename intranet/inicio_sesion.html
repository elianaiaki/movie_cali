<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INICIAR SESIÓN - bootstrap</title>
    <!--Estilos-->
    <link rel="stylesheet" href="../estilos/estilos_intranet/headerBoostrapIntranet.css">
    <link rel="stylesheet" href="../estilos/body.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/inicioS_Bootstrap.css">
    <link rel="stylesheet" href="../estilos/footer.css">
    <!-- Script -->
    <script src="../scripts/validaciones.js"></script>
    <script src="../scripts/intranet_scripts/asociarValidacionInicio.js"></script>
    <!--Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<!------------------------------------------------------------------------------------------->
<body onload="asociarValidacion()">
    <!--Header-->
    <header class="header container-fluid py-2">
        <div class="row align-items-center w-100">  
            <!--Logo-->
            <div class="col-lg-3 text-center text-lg-start">
                <img src="../recursos/imagenes/logo/logo.png" alt="Logo MovieCali" style="max-width: 500px;" class="img-fluid">
            </div>
        </div>
    </header>
<!------------------------------------------------------------------------------------------->
    <main class="container d-flex justify-content-center align-items-center contenedor-main"> 
        <section class="card shadow-lg p-4 p-sm-5 w-100 tarjeta-inicio" >
            <h2 class="text-center mb-4 fs-4 fw-bold text-uppercase">INICIO DE SESIÓN</h2>
            <!--Usuario-->
            <form id="inicio_de_sesion" action="../intranet/panel.html" method="get">
                <div class="mb-3">
                    <label for="usuario" class="form-label small fw-bold text-dark">USUARIO / CORREO ELECTRÓNICO</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0">
                            <img class="iconos" src="../recursos/imagenes/iconos/usuario.png" alt="icono usuario" >
                        </span>
                        <input id="usuario" name="usuario" type="text" class="form-control border-start-0 ps-1" required>
                    </div>
                </div>
                <!--Contraseña-->
                <div class="mb-4">
                    <label for="contrasenia" class="form-label small fw-bold text-dark">CONTRASEÑA</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0">
                            <img class="iconos" src="../recursos/imagenes/iconos/contraseña.webp" alt="icono contraseña">
                        </span>
                        <input id="contrasenia" name="contrasenia" type="password" class="form-control border-start-0 border-end-0 ps-1" required>
                        <button class="btn bg-white border border-start-0" type="button" id="btn-mostrar">
                            <img class="iconos" src="../recursos/imagenes/iconos/mostrar_contraseña.png" alt="ver" >
                        </button>
                    </div>
                </div>
                <!-- Olvidaste contraseña -->
                <div class="text-center mb-4">
                    <a href="../intranet/recuperar_contraseña.html" class="enlace-recuperar small fw-bold text-decoration-underline">¿OLVIDASTE TU CONTRASEÑA?</a>
                </div>
                <!--Boton-->
                <div class="d-grid">
                    <button type="submit" class="btn-accion btn text-white py-2 fs-6 fw-bold" >INICIAR SESIÓN</button>
                </div>
            </form>
        </section>
    </main>
<!-------------FOOTER------------------------------------------------------------------------------>
    <footer class="footer">
        <p class="titulo-footer">Desarrollado por:</p>
        <p class="nombres-footer">Gabriel Mayor - Eliana Salvo - Gabriel Ponce -Alan Walker - Gisella Jara - Brenda Pavez</p>
    </footer>

</body>
</html>
