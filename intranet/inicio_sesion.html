<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>INICIAR SESIÓN - Intranet</title>

    <link rel="stylesheet" href="../estilos/estilos_intranet/headerBoostrapIntranet.css">
    <link rel="stylesheet" href="../estilos/body.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/inicioDeSesion.css">
    <link rel="stylesheet" href="../estilos/footer.css">
    <!-- Script -->
    <script src="../scripts/validaciones.js"></script>
    <script src="../scripts/intranet_scripts/asociarValidacionInicio.js"></script>

</head>
<!------------------------------------------------------------------------------------------->
<body onload="asociarValidacion()">
    <!--Header-->
    <header class="header container-fluid py-2">
        <div class="row align-items-center w-100">  
            <!--Logo-->
            <div class="col-lg-3 text-center text-lg-start">
                <img src="../recursos/imagenes/logo/logo.png" alt="Logo MovieCali" style="max-width: 500px;" class="img-fluid">
            </div>
        </div>
        
    </header>
<!------------------------------------------------------------------------------------------->
    <main class="diseno-login"> 
        <section class="card-inicio">
            <h2>INICIO DE SESIÓN</h2>
            <form id="inicio_de_sesion" action="../intranet/panel.html" method="get">

                <div class="form-group">
                    <label>USUARIO / CORREO ELECTRÓNICO</label>
                    <div class="input-contenedor">
                        <img src="../recursos/imagenes/iconos/usuario.png" alt="icono usuario">
                        <input id="usuario" name="usuario" type="text" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>CONTRASEÑA</label>
                    <div class="input-contenedor">
                        <img src="../recursos/imagenes/iconos/contraseña.webp" alt="icono contraseña">
                        <input id="contrasenia" name="contrasenia" type="password" required>
                        <img src="../recursos/imagenes/iconos/mostrar_contraseña.png" alt="ver">
                    </div>
                </div>
                <!-- Olvidaste contraseña -->
                <div class="contenedor-enlace">
                    <a href="../intranet/recuperar_contraseña.html" class="enlace">¿OLVIDASTE TU CONTRASEÑA?</a>
                </div>
                
                <div class="contenedor-boton">
                    <button type="submit" class="boton-inicio">INICIAR SESIÓN</button>
                </div>
            </form>
        </section>
    </main>
<!-------------FOOTER------------------------------------------------------------------------------>
    <footer class="footer">
        <p>Desarrollado por: Gabriel Mayor · Eliana Salvo · Gabriel Ponce · Alan Walker · Gisella Jara · Brenda Pavez</p>
        <p>2026 MovieCali. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
