<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGREGAR NUEVOS ACTORES</title>
    
    <!-- BOOTSTRAP css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="../estilos/estilos_intranet/headerBoostrapIntranet.css">
    <link rel="stylesheet" href="../estilos/body.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/panelBoostrapintranet.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/encabezados.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/peliculasenrevisionBoostrap.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/botonera.css">
    <link rel="stylesheet" href="../estilos/footer.css">
    
    <!--script-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="../scripts/intranet_scripts/desplegable.js" defer></script>
    <script src="../scripts/validaciones.js" defer></script>
    <script src="../scripts/intranet_scripts/validacionActor.js" defer></script>
</head>
<!------------------------------------------------------------------------------------------->
<body onload="asociarValidacion()">
    <!--Header-->
    <header class="header container-fluid py-2">
        <div class="row align-items-center w-100">  
            <!--Logo-->
            <div class="col-lg-3 text-center text-lg-start">
                <img src="../recursos/imagenes/logo/logo.png" alt="Logo MovieCali" class="img-fluid">
            </div>
            <!--Buscador-->
            <div class="col-lg-6 my-2 my-lg-0 d-flex justify-content-center justify-content-lg-start">
                <form class="buscador d-flex w-100" style="max-width: 500px;">
                    <input type="text" class="form-control" placeholder="Buscar películas, series...">
                    <button class="btn btn-primary ms-2">🔍</button>
                </form>
            </div>
            <!--Perfil-->
            <div class="col-lg-3 d-flex justify-content-lg-end justify-content-center mt-2 mt-lg-0">
                <div class="perfil d-flex align-items-center gap-2" id="perfilBtn">
                    <img src="../recursos/imagenes/iconos/usuario.png" alt="usuario">
                    <!--Desplegable-->
                    <div class="desplegable-contenedor">
                        <select name="desplegable" id="desplegable" class="desplegable" onchange="navegarMenu(this)">
                            <option value="" selected disabled> MENU </option>
                            <option value="../intranet/mi_perfil.html">Mi perfil</option>
                            
                            <optgroup label="Gestión de Películas">
                                <option value="../intranet/peliculasenrevisionBoostrap.html"> Películas pendientes de revisión</option>
                                <option value="../intranet/nuevas_solicitudes_de_alta_peliculas.html"> Nuevas solicitudes de alta </option>
                            </optgroup> 
                            
                            <optgroup label="Administración Usuarios">
                                <option value="../intranet/gestion_de_perfil_roles.html">Gestión de perfil y roles</option>
                                <option value="../intranet/nuevo_perfil.html">Crear nuevo perfil</option>
                            </optgroup>  
                            
                            <option value="../intranet/inicio_sesion.html">Cerrar Sesión</option>     
                        </select>
                    </div> 
                </div>
            </div>
        </div>
    </header>
<!---------------------------------------------------------------------------------->
    <div class="container-fluid mt-3 px-4">
        <div class="row w-100">
            <div class="col-12 text-start ps-4">
                <a href="../intranet/panel.html" class="boton-panel">
                    <img src="../recursos/imagenes/iconos/Home.png" alt="Inicio" class="icon-home"> PANEL
                </a>
            </div>
        </div>
        <hr class="my-3"> </div>
<!---------------------------------------------------------------------------------->
    <main class="container my-4 px-3 px-md-5">
        
        <!-- Contenedor -->
        <div class="categoria-bloque card p-4 shadow border-0" >
            <h3 class="fs-4 fw-bold mb-4 border-bottom pb-2" >+ AGREGAR NUEVOS ACTORES</h3>
            
            <form id="formAgregarActor" action="../intranet/peliculas_en_revision.html" method="get">
                
                <!-- INPUTS -->
                <div class="row g-3">
                    
                    <div class="col-md-6">
                        <label for="nombre_actor" class="form-label fw-bold">Nombre:</label>
                        <input type="text" id="nombre_actor" class="form-control bg-dark text-white border-secondary" placeholder="Ingrese Nombre Completo" required>
                    </div>

                    <div class="col-md-6">
                        <label for="apellido_actor" class="form-label fw-bold">Apellido:</label>
                        <input type="text" id="apellido_actor" class="form-control bg-dark text-white border-secondary" placeholder="Ingrese Apellido Completo" required>
                    </div>

                    <div class="col-12">
                        <label for="participo_pelis" class="form-label fw-bold">Películas en las que participó:</label>
                        <div class="input-group">
                            <select name="participo_pelis" id="participo_pelis" class="form-select bg-dark text-white border-secondary" >
                                <optgroup label="Listado de Películas">
                                    <option value="Bone Keeper">Bone Keeper</option>
                                    <option value="Rascacielo en vivo">Rascacielo en vivo</option>
                                </optgroup>
                            </select>
                            <input type="text" id="nueva_participacion_pelicula" class="form-control bg-dark text-white border-secondary" placeholder="Agregar nueva participación">
                        </div>
                    </div>

                    <div class="col-12">
                        <label for="participo_series" class="form-label fw-bold">Series en las que participó:</label>
                        <div class="input-group">
                            <select name="participo_series" id="participo_series" class="form-select bg-dark text-white border-secondary">
                                <optgroup label="Listado de Series">
                                    <option value="Wonder Man">Wonder Man</option>
                                    <option value="Un Familiar">Un Familiar</option>
                                    <option value="El Robo">El Robo</option>
                                </optgroup>
                            </select>
                            <input type="text" id="nueva_participacion_serie" class="form-control bg-dark text-white border-secondary" placeholder="Agregar nueva participación">
                        </div>
                    </div>

                    <div class="col-12">
                        <label for="poster" class="form-label fw-bold">Subir imagen del actor:</label>
                        <input type="file" id="poster" class="form-control bg-dark text-white border-secondary" name="poster_image" accept="image/*" required>
                    </div>

                </div>

                <!-- SECCIÓN DE BOTONES INFERIORES-->
                <div class="mt-4 pt-3 border-top border-secondary">
                    <div class="d-flex flex-wrap gap-2 justify-content-end">
                        <button type="submit" class="btn btn-primary px-4">Guardar Cambios</button>
                        <button type="button" class="btn btn-secondary px-4" onclick="limpiarFormulario()">Restablecer</button>
                        <a href="../intranet/peliculas_en_revision.html" class="btn btn-outline-light px-4">Volver</a>
                    </div>
                </div>
            </form>
        </div>
    </main>
<!-------------FOOTER------------------------------------------------------------------------------>
    <footer class="footer mt-auto">
        <p class="titulo-footer">Desarrollado por:</p>
        <p class="nombres-footer">Gabriel Mayor - Eliana Salvo - Gabriel Ponce - Alan Walker - Gisella Jara - Brenda Pavez</p>
    </footer>
</body>
</html>
