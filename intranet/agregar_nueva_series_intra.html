<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>AGREGAR NUEVA SERIE</title>
    <link rel="stylesheet" href="../estilos/estilos_intranet/header_intranet.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/body_intranet.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/panel_intranet.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/contenedor_tabla_intranet.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/botones.css">
    <link rel="stylesheet" href="../estilos/footer.css">
    <script src="../scripts/intranet_scripts/desplegable.js" defer></script>
</head>

<body>
   
<!------------------------------------------------------------------------------------------->
    <!-- HEADER -->
    <header class="header">
        <!-- LOGO -->
        <div class="logo">
            <img src="../recursos/imagenes/logo/logo.png"
                alt="Logo MovieCali">
        </div>

        <!-- BUSCADOR -->
        <form class="buscador">
            <input type="text"
                placeholder="Buscar películas, series...">

            <button>🔍</button>
        </form>

        <!-- PERFIL -->
        <div class="perfil" id="perfilBtn">
            <img src="../recursos/imagenes/iconos/usuario.png" alt="usuario">
        <!-- DESPLEGABLE -->
            <div class="desplegable">
                <form>
                    <select name="desplegable" id="desplegable" onchange="navegarMenu(this)">
                        <option value="" selected disabled>Selecciona una opción...</option>
                        <option value="../intranet/mi_perfil.html">Mi perfil</option>
                        <hr>
                        <optgroup label="Gestión de Películas">
                            <option value="../intranet/peliculas_pendientes_de_revision.html">
                                Películas pendientes de revisión
                            </option>
                            <option value="../intranet/nuevas_solicitudes_de_alta_peliculas.html">
                                Nuevas solicitudes de alta
                            </option>
                        </optgroup> 
                        <hr>
                        <optgroup label="Administración Usuarios">
                            <option value="../intranet/gestion_de_perfil_roles.html">
                                Gestión de perfil y roles
                            </option>
                            <option value="../intranet/nuevo_perfil.html">
                                Crear nuevo perfil
                            </option>
                        </optgroup>  
                        <hr>
                        <option value="../intranet/inicio_de_sesion.html">Cerrar Sesión</option>     
                    </select>
                </form>      
            </div> 
        </div>
    </header>

    <br>
<!------------------FIN DE HEADER------------------------------------------------------------------------->
    <main class="main">
        <div class="contenedor-panel">
            <div class="Panel">
                <img src="../recursos/imagenes/iconos/Home.png" alt="Inicio" width="30" height="30">
                <a href="../intranet/panel.html">PANEL</a>
            </div>
        </div>
        <h1>+ AGREGAR NUEVA SERIE</h1>
<!------------------------------------------------------------------------------------------->
       <div class="contenedor-formulario">
            <h2>Agregar Serie</h2>
            
            <form id="form_agregar">
                
                <div class="grupo-campo">
                    <label for="Titulo_serie">Título:</label>
                    <input type="text" id="Titulo_serie" class="input-texto" placeholder="Vladimir">
                </div>

                <div class="grupo-campo">
                    <label for="Genero_serie">Género:</label>
                    <input type="text" id="Genero_serie" class="input-texto" placeholder="Comedia, Drama">
                </div>

                <div class="grupo-campo">
                    <label for="Ano_estreno">Año de Estreno:</label>
                    <input type="text" id="Ano_estreno" class="input-texto" placeholder="20 de Abril 2026">
                </div>

                <div class="grupo-campo">
                    <label for="Duracion_serie">Duración:</label>
                    <input type="text" id="Duracion_serie" class="input-texto" placeholder="30 min">
                </div>

                <div class="grupo-campo">
                    <label for="Director">Director:</label>
                    <input type="text" id="Director" class="input-texto" placeholder="Shari Springer Berman">
                </div>

                <div class="grupo-campo">
                    <label for="Productor_serie">Productor:</label>
                    <input type="text" id="Productor_serie" class="input-texto" placeholder="Ingrese nombre y apellido">
                </div>

                <div class="grupo-campo">
                    <label for="Calificacion_serie">Calificación General:</label>
                    <input type="text" id="Calificacion_serie" class="input-texto" placeholder="6.5 / 10">
                </div>

                <div class="grupo-campo-archivo">
                    <label for="icons_plataforma">Plataformas (Icono):</label>
                    <div class="subir-archivo">
                        <input type="file" id="icons_plataforma" name="icons_plataforma" accept="image/*" required>
                    </div>
                </div>

                <div class="grupo-campo">
                    <label for="Cant_temporadas">Temporadas:</label>
                    <input type="text" id="Cant_temporadas" class="input-texto" placeholder="Cant_temporadas">
                </div>

                <div class="grupo-campo">
                    <label for="clasificacion_edad">Clasificación por Edad:</label>
                    <input type="text" id="clasificacion_edad" class="input-texto" placeholder="+18">
                </div>

                <div class="grupo-campo">
                    <label for="Reparto">Reparto:</label>
                    <div class="reparto-contenedor">
                        <select name="reparto" id="Reparto">
                            <optgroup label="Listados">
                                <option value="Rachel Weisz">Rachel Weisz</option>
                            </optgroup>
                        </select>
                        <input type="text" class="input-texto" placeholder="Agregar nuevos actores">
                    </div>
                </div>

                <div class="grupo-campo-completo">
                    <label for="sinopsis">Sinopsis:</label>
                    <textarea id="sinopsis" name="sinopsis_serie" rows="4" placeholder="Escribe aquí el resumen de la trama..."></textarea>
                </div>

                <div class="grupo-campo-archivo">
                    <label for="video-upload">Tráiler:</label>
                    <div class="subir-archivo">
                        <input type="file" id="video-upload" name="video_numero" accept="video/*" required>
                    </div>
                </div>

                <div class="grupo-campo-archivo">
                    <label for="Poster">Cargar Póster:</label>
                    <div class="subir-archivo">
                        <input type="file" id="Poster" name="poster_image" accept="image/*" required>
                    </div>
                </div>

                <div class="botones-inferiores">
                    <button type="submit" class="btn-gris">Guardar Cambios</button>
                    <button type="reset" class="btn-gris">Restablecer</button>
                    <a href="../intranet/series_pendientes_de_revision_intra.html" class="btn-gris">Volver</a>
                </div>

            </form>
        </div>
    </main>

    <br>
    <br>
    <br>

    <!-- FOOTER -->
    <footer class="footer">

        <p class="titulo-footer">
            Desarrollado por:

        <p class="nombres-footer">

            Alan Walker - Gisella Jara - Brenda Pavez

    </footer>
</body>
</html>
