<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>CONFIRMAR ELIMINACION SERIE</title>
    <link rel="stylesheet" href="../estilos/estilos_intranet/header_intranet.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/body_intranet.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/panel_intranet.css">
    <link rel="stylesheet" href="../estilos/footer.css">
    <script src="../scripts/intranet_scripts/desplegable.js" defer></script>
</head>

<body>

<!-----------HEADER-------------------------------------------------------------------------------->
    <!-- HEADER -->
    <header class="header">
        <!-- LOGO -->
        <div class="logo">
            <img src="../recursos/imagenes/logo/logo.png"
                alt="Logo MovieCali">
        </div>

        <!-- BUSCADOR -->
        <form class="buscador">
            <input type="text"
                placeholder="Buscar películas, series...">

            <button>🔍</button>
        </form>

        <!-- PERFIL -->
        <div class="perfil" id="perfilBtn">
            <img src="../recursos/imagenes/iconos/usuario.png" alt="usuario">
        <!-- DESPLEGABLE -->
            <div class="desplegable">
                <form>
                    <select name="desplegable" id="desplegable" onchange="navegarMenu(this)">
                        <option value="" selected disabled>Selecciona una opción...</option>
                        <option value="../intranet/mi_perfil.html">Mi perfil</option>
                        <hr>
                        <optgroup label="Gestión de Películas">
                            <option value="../intranet/peliculas_pendientes_de_revision.html">
                                Películas pendientes de revisión
                            </option>
                            <option value="../intranet/nuevas_solicitudes_de_alta_peliculas.html">
                                Nuevas solicitudes de alta
                            </option>
                        </optgroup> 
                        <hr>
                        <optgroup label="Administración Usuarios">
                            <option value="../intranet/gestion_de_perfil_roles.html">
                                Gestión de perfil y roles
                            </option>
                            <option value="../intranet/nuevo_perfil.html">
                                Crear nuevo perfil
                            </option>
                        </optgroup>  
                        <hr>
                        <option value="../intranet/inicio_de_sesion.html">Cerrar Sesión</option>     
                    </select>
                </form>      
            </div> 
        </div>
    </header>

    <br><br>
<!-------FIN DE HEADER------------------------------------------------------------------------>
    <br>
    <main class="main">
        <div>
            <h1>ELIMINAR SERIE</h1>
            <p>¿Seguro que desea eliminar esta Serie?</p>
            <img src="../recursos/imagenes/series/911.jpg" align="left" width="150" height="150">
            <p>Serie:911</p>
            <button>ELIMINAR</button>
            <a href="../intranet/series_pendientes_de_revision_intra.html">Cancelar</a>

        </div>
    </main>
    <br>
    <br>
    <br>
    <br>
