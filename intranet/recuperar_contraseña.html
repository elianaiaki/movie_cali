<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>RECUPERAR CONTRASEÑA - Intranet</title>
    <link rel="stylesheet" href="../estilos/estilos_intranet/body_intranet.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/header_intranet.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/inicio_intranet.css">
    <link rel="stylesheet" href="../estilos/footer.css">
    <!--Scrip-->
    <script src="../scripts/validaciones.js"></script>
    <script src="../scripts/intranet_scripts/recuperarContraseña.js"></script>
</head>
<!------------------------------------------------------------------------------------------->
<body onload="asociarValidacion()">
    <!-- HEADER -->
    <header class="header">
        <!--LOGO-->
        <div class="logo">
            <img src="../recursos/imagenes/logo/logo.png" alt="Logo MovieCali">
        </div>  
    </header>
<!------------------------------------------------------------------------------------------->
    <main class="diseno-login"> 
        <section class="carta-login">
            <h2>RECUPERAR CONTRASEÑA</h2>
            <form id="recuperar_contrasenia" action="../intranet/inicio_de_sesion.html" method="get">
                <div>
                    <label>USUARIO / CORREO ELECTRONICO</label><br>
                    <img class="iconosVarios" src="../recursos/imagenes/iconos/usuario.png" alt="icono usuario" >
                    <input type="text" id="usuario" name="usuario" placeholder="Ingrese usuario o correo" required>
                </div>
                
            
                <div>
                    <label>CONTRASEÑA</label><br>
                    <img class="iconosVarios" src="../recursos/imagenes/iconos/contraseña.webp" alt="icono contraseña" >
                    <input type="password" id="contrasenia" name="password" placeholder="Ingrese contraseña" required >
                    <img class="iconosVarios" src="../recursos/imagenes/iconos/mostrar_contraseña.png" alt="ver">
                </div>
                                
                <div> 
                    <label>REPETIR CONTRASEÑA</label><br>
                    <img class="iconosVarios" src="../recursos/imagenes/iconos/contraseña.webp" alt="icono contraseña" >
                    <input type="password" id="repetirContrasenia" name="repetir-password" placeholder="Ingrese de nuevo la contraseña" required>
                    <img class="iconosVarios" src="../recursos/imagenes/iconos/mostrar_contraseña.png" alt="ver">
                </div>

                <div class="contenedor-boton">
                    <button type="submit" class="boton-inicio">GUARDAR</button>
                    <a href="../intranet/inicio_de_sesion.html" class = "boton-cancelar">CANCELAR</a>
                </div>
            </form>
        </section>
    </main>
<!-------------FOOTER------------------------------------------------------------------------------>
    <footer class="footer">
        <p class="titulo-footer">Desarrollado por:</p>
        <p class="nombres-footer">Gabriel Mayor - Eliana Salvo - Gabriel Ponce -Alan Walker - Gisella Jara - Brenda Pavez</p>
    </footer>
</body>
</html>
