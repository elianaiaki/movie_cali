<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>RECUPERAR CONTRASEÑA - Intranet</title>
    <link rel="stylesheet" href="../estilos/estilos_intranet/body_intranet.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/header_intranet.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/inicio_intranet.css">
    <link rel="stylesheet" href="../estilos/footer.css">
</head>

<body class="body">
    <!-- HEADER -->
    <header class="header">
        <!--LOGO-->
        <div class="logo">
            <img src="../recursos/imagenes/logo/logo.png" alt="Logo MovieCali" width="500" height="260">
        </div>
        
    </header>

   <!-- FIN DE HEADER-->
<!------------------------------------------------------------------------------------------->
    <hr>
    <main class="diseno-login"> 
        <section class="carta-login">
            <h2>RECUPERAR CONTRASEÑA</h2>
            <form action="../intranet/inicio_de_sesion.html" method="get">
                <!-- Usuario -->
                <div>
                    <label>USUARIO / CORREO ELECTRONICO</label><br>
                    <img src="../recursos/imagenes/iconos/usuario.png" alt="icono usuario" width="20" height="20" style="vertical-align: middle;">
                    <input type="text" name="usuario" placeholder="Ingrese usuario o correo" required style="width: 250px;">
                </div>
                
                <!-- Contraseña -->
                <div>
                    <label>CONTRASEÑA</label><br>
                    <img src="../recursos/imagenes/iconos/contraseña.webp" alt="icono contraseña" width="20" height="20" style="vertical-align: middle;">
                    <input type="password" name="password" placeholder="Ingrese contraseña" required style="width: 250px;">
                    <img src="../recursos/imagenes/iconos/mostrar_contraseña.png" alt="ver" width="20" height="20" style="vertical-align: middle; cursor: pointer;">
                </div>
                                
                <div> 
                    <label>REPETIR CONTRASEÑA</label><br>
                    <img src="../recursos/imagenes/iconos/contraseña.webp" alt="icono contraseña" width="20" height="20" style="vertical-align: middle;">
                    <input type="password" name="repetir-password" placeholder="Ingrese de nuevo la contraseña" required style="width: 250px;">
                    <img src="../recursos/imagenes/iconos/mostrar_contraseña.png" alt="ver" width="20" height="20" style="vertical-align: middle; cursor: pointer;">
                </div>

                <!-- Botones para guardar contraseña y cancelar-->
                <div class="contenedor-boton">
                    <button type="submit" class="boton-inicio">GUARDAR</button>

                    <a href="../intranet/inicio_de_sesion.html" class = "boton-cancelar">CANCELAR</a>
                </div>

            </form>
        </section>
    </main>

    <!-- FOOTER -->
    <footer class="footer">

        <p class="titulo-footer">
            Desarrollado por:
        </p>

        <p class="nombres-footer">
            Gabriel Mayor - Eliana Salvo - Gabriel Ponce -
            Alan Walker - Gisella Jara - Brenda Pavez
        </p>

    </footer>
 
</body>
</html>
