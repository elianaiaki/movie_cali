<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>RECUPERAR CONTRASEÑA - Intranet</title>
    <link rel="stylesheet" href="../estilos/body.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/headerBoostrapIntranet.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/inicioDeSesion.css">
    <link rel="stylesheet" href="../estilos/footer.css">
    <!--Scrip-->
    <script src="../scripts/validaciones.js"></script>
    <script src="../scripts/intranet_scripts/recuperarContraseña.js"></script>
</head>
<!------------------------------------------------------------------------------------------->
<body onload="asociarValidacion()">
    <!--Header-->
    <header class="header container-fluid py-2">
        <div class="row align-items-center w-100">  
            <!--Logo-->
            <div class="col-lg-3 text-center text-lg-start">
                <img src="../recursos/imagenes/logo/logo.png" alt="Logo MovieCali" style="max-width: 500px;" class="img-fluid">
            </div>
        </div>
        
    </header>
<!------------------------------------------------------------------------------------------->
    <main class="diseno-login"> 
        <section class="card-inicio">
            <h2>RECUPERAR CONTRASEÑA</h2>
            <form id="recuperar_contrasenia" action="../intranet/inicio_sesion.html" method="get">
                <div class="form-group">
                    <label>USUARIO / CORREO ELECTRÓNICO</label>
                    <div class="input-contenedor">
                        <img src="../recursos/imagenes/iconos/usuario.png" alt="icono usuario">
                        <input id="usuario" name="usuario" type="text" required>
                    </div>
                </div>
                
            
                <div class="form-group">
                    <label>CONTRASEÑA</label><br>
                    <div class="input-contenedor">
                        <img class="iconosVarios" src="../recursos/imagenes/iconos/contraseña.webp" alt="icono contraseña" >
                        <input type="password" id="contrasenia" name="password" placeholder="Ingrese contraseña" required >
                        <img class="iconosVarios" src="../recursos/imagenes/iconos/mostrar_contraseña.png" alt="ver">
                    </div>    
                </div>
                                
                <div class="form-group"> 
                    <label>REPETIR CONTRASEÑA</label>
                    <div class="input-contenedor">
                        <img class="iconosVarios" src="../recursos/imagenes/iconos/contraseña.webp" alt="icono contraseña" >
                        <input type="password" id="repetirContrasenia" name="repetir-password" placeholder="Ingrese de nuevo la contraseña" required>
                        <img class="iconosVarios" src="../recursos/imagenes/iconos/mostrar_contraseña.png" alt="ver">
                    </div>
                </div>

                <div class="contenedor-boton">
                    <button type="submit" class="boton-inicio">GUARDAR</button>
                    <a href="../intranet/inicio_sesion.html" class="cancelar">CANCELAR</a>
                </div>
            </form>
        </section>
    </main>
<!-------------FOOTER------------------------------------------------------------------------------>
    <footer class="footer">
        <p>Desarrollado por: Gabriel Mayor · Eliana Salvo · Gabriel Ponce · Alan Walker · Gisella Jara · Brenda Pavez</p>
        <p>2026 MovieCali. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
