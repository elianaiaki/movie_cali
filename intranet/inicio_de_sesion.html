<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>INICIAR SESIÓN - Intranet</title>
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>MovieCali</h1>
        <!-- Logo -->
        <img src="../recursos/imagenes/logo/logo.png" alt="Logo MovieCali" width="500" height="260">
    </header>

   <!-- FIN DE HEADER-->

    <!------------------------------------------------------------------------------------------->
    <hr>
    <main>
        <section>
            <h2>INICIO DE SESION</h2>

            <!-- Action a panel.html para conectar con la Intranet -->
            <form action="../intranet/panel.html" method="get">

                <!-- Usuario -->
                <div style="margin-bottom: 15px;">
                    <label>USUARIO / CORREO ELECTRONICO</label><br>
                    <img src="../recursos/imagenes/iconos/usuario.png" alt="icono usuario" width="20" height="20" style="vertical-align: middle;">
                    <input type="text" name="usuario" required style="width: 250px;">
                </div>

                <!-- Contraseña -->
                <div style="margin-bottom: 5px;">
                    <label>CONTRASEÑA</label><br>
                    <img src="../recursos/imagenes/iconos/contraseña.webp" alt="icono contraseña" width="20" height="20" style="vertical-align: middle;">
                    <input type="password" name="password" required style="width: 250px;">
                    <img src="../recursos/imagenes/iconos/mostrar_contraseña.png" alt="ver" width="20" height="20" style="vertical-align: middle; cursor: pointer;">
                </div>

                <!-- Olvidaste contraseña -->
                <div style="margin-bottom: 20px; width: 270px; text-align: right;">
                    <a href="#" style="font-size: 0.8em; color: blue;">¿OLVIDASTE TU CONTRASEÑA?</a>
                </div>

                <!-- Botón Iniciar Sesión -->
                <div style="margin-bottom: 10px;">
                    <button type="submit" style="width: 275px; padding: 5px; cursor: pointer;">INICIAR SESION</button>
                </div>

            </form>
        </section>
    </main>

    <!-- FOOTER -->
    <footer style="margin-top: 50px;">
        <hr>
        <p>Desarrollado por: Gabriel Mayor · Eliana Salvo · Gabriel Ponce · Alan Walker · Gisella Jara · Brenda Pavez</p>
        <p>2026 MovieCali. Todos los derechos reservados.</p>
    </footer>
 
</body>
</html>
