<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>AGREGAR NUEVOS ACTORES</title>
    <link rel="stylesheet" href="../estilos/estilos_intranet/header_intranet.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/body_intranet.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/panel_intranet.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/contenedor_tabla_intranet.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/botones.css">
    <link rel="stylesheet" href="../estilos/footer.css">
    <script src="../scripts/intranet_scripts/desplegable.js" defer></script>
    
    <script src="../scripts/validaciones.js"></script>
    
    <script>
        function asociarValidacion(){

            const formulario = document.getElementById("formAgregarActor");

            formulario.addEventListener("submit", function(event){

                event.preventDefault();

                const nombreActor = document.getElementById("nombre_actor").value;

                const apellidoActor = document.getElementById("apellido_actor").value;

                const nuevaParticipacionPelicula = document.getElementById("nueva_participacion_pelicula").value;

                const nuevaParticipacionSerie = document.getElementById("nueva_participacion_serie").value;
                
                if(!textoAlfabeticoValido(nombreActor)){
                    alert("Nombre inválido");
                    return;
                }

                if(!textoAlfabeticoValido(apellidoActor)){
                    alert("Apellido inválido");
                    return;
                }

                if(nuevaParticipacionPelicula !== "" && !textoAlfanumericoValido(nuevaParticipacionPelicula)){
                    alert("Participación en película inválida");
                    return;
                }

                if(nuevaParticipacionSerie !== "" && !textoAlfanumericoValido(nuevaParticipacionSerie)){
                    alert("Participación en serie inválida");
                    return;
                }

                alert("Actor agregado correctamente");

                formulario.submit();

            });
        }
        
        function limpiarFormulario(){
            if(confirm("¿Desea limpiar todos los campos?")){
                document.getElementById("formAgregarActor").reset();
            }
        }

    </script>

</head>

<body onload="asociarValidacion()">
    
<!------------------------------------------------------------------------------------------->
    <!-- HEADER -->
    <header class="header">
        <!-- LOGO -->
        <div class="logo">
            <img src="../recursos/imagenes/logo/logo.png"
                alt="Logo MovieCali">
        </div>

        <!-- BUSCADOR -->
        <form class="buscador">
            <input type="text"
                placeholder="Buscar películas, series...">

            <button>🔍</button>
        </form>

        <!-- PERFIL -->
        <div class="perfil" id="perfilBtn">
            <img src="../recursos/imagenes/iconos/usuario.png" alt="usuario">
        <!-- DESPLEGABLE -->
            <div class="desplegable">
                <form>
                    <select name="desplegable" id="desplegable" onchange="navegarMenu(this)">
                        <option value="" selected disabled>Selecciona una opción...</option>
                        <option value="../intranet/mi_perfil.html">Mi perfil</option>
                        <hr>
                        <optgroup label="Gestión de Películas">
                            <option value="../intranet/peliculas_pendientes_de_revision.html">
                                Películas pendientes de revisión
                            </option>
                            <option value="../intranet/nuevas_solicitudes_de_alta_peliculas.html">
                                Nuevas solicitudes de alta
                            </option>
                        </optgroup> 
                        <hr>
                        <optgroup label="Administración Usuarios">
                            <option value="../intranet/gestion_de_perfil_roles.html">
                                Gestión de perfil y roles
                            </option>
                            <option value="../intranet/nuevo_perfil.html">
                                Crear nuevo perfil
                            </option>
                        </optgroup>  
                        <hr>
                        <option value="../intranet/inicio_de_sesion.html">Cerrar Sesión</option>     
                    </select>
                </form>      
            </div> 
        </div>
    </header>

    <br>
<!--------FIN DE HEADER----------------------------------------------------------------------------------->

    <main class="main">
        <div class="contenedor-panel">
            <div class="Panel">
                <img src="../recursos/imagenes/iconos/Home.png" alt="Inicio" width="30" height="30">
                <a href="../intranet/panel.html">PANEL</a>
            </div>
        </div>
<!------------------------------------------------------------------------------------------->
        <div class="contenedorFormulario">
            <h2>+ AGREGAR NUEVOS ACTORES</h2>
            
            <form id="formAgregarActor" action="../intranet/peliculas_pendientes_de_revision.html" method="get">
                
                <div class="grupoCampo">
                    <label for="Nombre_actor">Nombre:</label>
                    <input type="text" id="nombre_actor" class="inputTexto" placeholder="Ingrese Nombre Completo" required>
                </div>

                <div class="grupoCampo">
                    <label for="Apellido_actor">Apellido:</label>
                    <input type="text" id="apellido_actor" class="inputTexto" placeholder="Ingrese Apellido Completo" required>
                </div>

                <div class="grupoCampo">
                    <label for="Participo_pelis">Películas en las que participó:</label>
                    <div class="repartoContenedor">
                        <select name="participo_pelis" id="participo_pelis">
                            <optgroup label="Listado de Películas">
                                <option value="Bone Keeper">Bone Keeper</option>
                                <option value="Rascacielo en vivo">Rascacielo en vivo</option>
                            </optgroup>
                        </select>
                        <input type="text" id="nueva_participacion_pelicula" class="inputTexto" placeholder="Agregar nueva participación">
                    </div>
                </div>

                <div class="grupoCampo">
                    <label for="participo_series">Series en las que participó:</label>
                    <div class="repartoContenedor">
                        <select name="participo_series" id="participo_series">
                            <optgroup label="Listado de Series">
                                <option value="Wonder Man">Wonder Man</option>
                                <option value="Un Familiar">Un Familiar</option>
                                <option value="El Robo">El Robo</option>
                            </optgroup>
                        </select>
                        <input type="text" id="nueva_participacion_serie" class="inputTexto" placeholder="Agregar nueva participación">
                    </div>
                </div>

                <div class="grupoCampoArchivo">
                    <label for="Poster">Subir imagen del actor:</label>
                    <div class="subir-archivo">
                        <input type="file" id="poster" name="poster_image" accept="image/*" required>
                    </div>
                </div>

                <div class="botones-inferiores">
                    <button type="submit" class="btn-gris">Guardar Cambios</button>
                    <button type="button" class="btn-gris" onclick="limpiarFormulario()">Restablecer</button>
                    <a href="../intranet/peliculas_pendientes_de_revision.html" class="btn-gris">Volver</a>
                </div>
            </form>
        </div>
    </main>

    <br>
    <br>
    <br>

</html>
