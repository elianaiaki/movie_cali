<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>EDITAR PERFIL</title>
</head>

<body>

    <!--HEADER-->
    <header>
        <h1>MovieCali</h1>
        <img src="../recursos/imagenes/logo/logo.png" alt="Logo MovieCali" width="500" height="260">

        <!--Buscador-->
        <form>
            <input type="text" placeholder="Buscar películas, series...">
            <button type="submit">Buscar</button>
        </form>

        <!--Navegación Desplegable-->
        <nav>
            <form>
                <label for="desplegable">Menú de Navegación:</label>
                <select name="desplegable" id="desplegable">
                    <option value="mi_perfil">Mi perfil</option>
                    <optgroup label="Gestión de Películas">
                        <option value="peliculas_pendientes">Películas pendientes de revisión</option>
                        <option value="nuevas_solicitudes">Nuevas solicitudes de alta</option>
                    </optgroup>
                    <optgroup label="Administración Usuarios">
                        <option value="gestion_perfiles">Gestión de perfil y roles</option>
                        <option value="nuevo_perfil">Crear nuevo perfil</option>
                    </optgroup>
                    <option value="cerrar_sesion">Cerrar Sesión</option>
                </select>
            </form>
        </nav>
    </header> 

    <hr>

    <main>
        <!--PANEL DE ACCESO RÁPIDO-->
        <nav>
            <table border="1">
                <tr>
                    <td align="center">
                        <img src="../recursos/imagenes/iconos/Home.png" width="30" height="30" alt="Inicio">
                        <a href="../intranet/panel.html">PANEL</a>
                    </td>
                </tr>
            </table>
            <p><strong>GESTIÓN DE REPORTES DE RESEÑAS ▶</strong></p>
        </nav>

        <br>
        
        <h2>EDITAR PERFIL</h2>

        <section>
            <!-- Imagen del perfil -->
            <div>
                <img src="../recursos/imagenes/iconos/perfil.png" alt="Foto de perfil actual" width="100">
                <button type="button">CAMBIAR FOTO</button>
            </div>
    
            <form>
                <!-- Uso de "value" para datos precargados -->
                <div>
                    <label>Nombre:</label>
                    <input type="text" value="Leon">
                </div>
                <div>
                    <label>Apellido:</label>
                    <input type="text" value="Kennedy">
                </div>
                <div>
                    <label>Email:</label>
                    <input type="email" value="lskennedy@gmail.com">
                </div>

                <div>
                    <label>ID:</label>
                    <input type="text" value="85461" readonly> <!-- 'readonly' protege el ID -->
                </div>

                <div>
                    <label>Rol:</label>
                    <select>
                        <option selected>ADMINISTRADOR</option>
                        <option>USUARIO</option>
                    </select>
                </div>

                <div>
                    <label>Contraseña:</label>
                    <input type="password" value="**********">
                </div>

                <div>
                    <label>Celular:</label>
                    <input type="tel" value="+549-2705-869344">
                </div>

                <div>
                    <button type="submit">GUARDAR CAMBIOS</button>
                    
                    <!-- Enlace para volver al Panel -->
                    <a href="../intranet/gestion_de_perfil_roles.html">
                        <button type="button">Cancelar</button>
                    </a>
                </div>
            </form>
        </section>
    </main>

    <br><br>

    <!-- FOOTER-->
    <footer>
        <hr>
        <p>Desarrollado por: Gabriel Mayor · Eliana Salvo · Gabriel Ponce · Alan Walker · Gisella Jara · Brenda Pavez</p>
        <p>&copy; 2026 MovieCali. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
