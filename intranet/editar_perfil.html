<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <title>EDITAR PERFIL</title>
    <link rel="stylesheet" href="../estilos/estilos_intranet/header_intranet.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/body_intranet.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/panel_intranet.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/contenedores_intranet.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/botones.css">

    <script src="../scripts/intranet_scripts/desplegable.js" defer></script>

    <script src="../scripts/validaciones.js"></script>  <!-- CONEXION CON JS-->

    <script>
        function asociarValidacion(){

            // Obtener formulario
            const formulario = document.getElementById("editar_perfil");

            // Evento submit
            formulario.addEventListener("submit", function(event){

                // Frenar envío automático
                event.preventDefault();

                // Obtener valores
                const nombre = document.getElementById("nombre").value;

                const apellido = document.getElementById("apellido").value;

                const correo = document.getElementById("correo").value;

                const identificador = document.getElementById("identificador").value;

                const contrasenia = document.getElementById("contrasenia").value;

                const celular = document.getElementById("celular").value;

                let errores = "";

                // Validar nombre
                if(!textoAlfabeticoValido(nombre)){
                    errores += "- Nombre inválido\n";
                }

                // Validar apellido
                if(!textoAlfabeticoValido(apellido)){
                    errores += "- Apellido inválido\n";
                }

                // Validar correo
                if(!correoValido(correo)){
                    errores += "- Correo inválido\n";
                }

                // Validar identificador
                if(!textoAlfanumericoValido(identificador)){
                    errores += "- ID inválido\n";
                }

                // Validar contraseña
                if(!contraseniaValida(contrasenia)){
                    errores += "- Contraseña inválida\n";
                }

                // Validar celular
                if(!numeroTelefonoValido(celular)){
                    errores += "- Número de celular inválido\n";
                }

                // Mostrar errores
                if(errores !== ""){
                    alert("Se encontraron los siguientes errores:\n\n" + errores);
                    return;
                }

                // Confirmación
                if(confirm("¿Desea guardar los cambios realizados?")){

                    alert("Perfil actualizado correctamente");

                    formulario.submit();

                }

            });

        }

    </script>
</head>

<body class="body" onload="asociarValidacion()">
