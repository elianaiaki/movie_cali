<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>EDITAR PERFIL</title>
    <link rel="stylesheet" href="../estilos/estilos_intranet/header_intranet.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/body_intranet.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/panel_intranet.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/editar_perfil.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/botones.css">
    <link rel="stylesheet" href="../estilos/footer.css">
    <script src="../scripts/intranet_scripts/desplegable.js" defer></script>
    <script src="../scripts/intranet_scripts/validacionEditarPerfil.js"></script>
    <script src="../scripts/validaciones.js"></script>
</head>

<body class="body" onload="asociarValidacion()">

<!----------------HEADER------------------------------------------------>
    <header class="header">
        <!-- LOGO -->
        <div class="logo">
            <img src="../recursos/imagenes/logo/logo.png" alt="Logo MovieCali">
        </div>

        <!-- BUSCADOR -->
        <form class="buscador">
            <input type="text" placeholder="Buscar películas, series...">
            <button>🔍</button>
        </form>

        <!-- PERFIL -->
        <div class="perfil" id="perfilBtn">
            <img src="../recursos/imagenes/iconos/usuario.png" alt="usuario">
        <!-- DESPLEGABLE -->
            <div class="desplegable">
                <form>
                    <select name="desplegable" id="desplegable" onchange="navegarMenu(this)">
                        <option value="" selected disabled>Selecciona una opción...</option>
                        <option value="../intranet/mi_perfil.html">Mi perfil</option>
                        <hr>
                        <optgroup label="Gestión de Películas">
                            <option value="../intranet/peliculas_pendientes_de_revision.html">
                                Películas pendientes de revisión
                            </option>
                            <option value="../intranet/nuevas_solicitudes_de_alta_peliculas.html">
                                Nuevas solicitudes de alta
                            </option>
                        </optgroup> 
                        <hr>
                        <optgroup label="Administración Usuarios">
                            <option value="../intranet/gestion_de_perfil_roles.html">
                                Gestión de perfil y roles
                            </option>
                            <option value="../intranet/nuevo_perfil.html">
                                Crear nuevo perfil
                            </option>
                        </optgroup>  
                        <hr>
                        <option value="../intranet/inicio_de_sesion.html">Cerrar Sesión</option>     
                    </select>
                </form>      
            </div> 
        </div>
    </header>
<!----------- FIN DE HEADER--------------------------------------->
    <hr>
    <main class="main">

        <!--PANEL DE ACCESO RÁPIDO-->
        <div class="contenedor-panel">
            <div class="Panel">
                <img src="../recursos/imagenes/iconos/Home.png" alt="Inicio" width="30" height="30">
                <a href="../intranet/panel.html">PANEL</a>
            </div>
        </div>       
        
        <section class="contenedorGeneral">

            <h2>EDITAR PERFIL</h2>
            

            <div class="contenedorEditarPerfil">
                <div class="contenedorImg">    
                    <img src="../recursos/imagenes/iconos/perfil.png" alt="Foto de perfil actual" >
                    <input type="file" id="fotoPerfil" accept="image/*" hidden></input>
                    <button type="button" class="btn-gris" onclick="document.getElementById('fotoPerfil').click();">CAMBIAR FOTO</button>
                </div>   
                <form id="editar_perfil" class="contenedorForm">

                    <div class="grupoCampo">
                        <label>Nombre:</label>
                        <input type="text" id="nombre" class="inputTexto" value="Leon">
                    </div>

                    <div class="grupoCampo">
                        <label>Apellido:</label>
                        <input type="text" id="apellido" class="inputTexto" value="Kennedy">
                    </div>

                    <div class="grupoCampo">
                        <label>ID:</label>
                        <input type="text" id="identificador" class="inputTexto" value="85461" readonly>
                    </div>

                    <div class="grupoCampo">
                        <label>Rol:</label>
                        <select>
                            <option selected>ADMINISTRADOR</option>
                            <option>USUARIO</option>
                        </select>
                    </div>

                    <div class="grupoCampo">
                        <label>Email:</label>
                        <input type="email" id="correo" class="inputTexto" value="lskennedy@gmail.com">
                    </div>

                    <div class="grupoCampo">
                        <label>Permisos:</label>
                        <select>
                            <option selected>ADMINISTRADOR</option>
                            <option>USUARIO</option>
                        </select>
                    </div>

                    <div class="grupoCampo">
                        <label>Contraseña:</label>
                        <input type="password" id="contrasenia" class="inputTexto" placeholder="Ingrese la contraseña">
                    </div>

                    <div class="grupoCampo">
                        <label>Repetir Contraseña:</label>
                        <input type="password" id="repetirContrasenia" class="inputTexto" placeholder="Ingrese nuevamente la contraseña">
                    </div>
                    <div class="contenedorBtn">
                        <div class="botones-inferiores">
                            <button type="submit" class="btn-gris">GUARDAR CAMBIOS</button>
                            <a href="../intranet/gestion_de_perfil_roles.html" class="btn-gris">Cancelar</a>
                        </div>
                    </div>
                    
                </form>
            </div>
        </section>
    </main>

    <!-- -------------FOOTER------------------>
    <footer class="footer">
        <p class="titulo-footer">
            Desarrollado por:
        </p>
        <p class="nombres-footer">
            Gabriel Mayor - Eliana Salvo - Gabriel Ponce - Alan Walker - Gisella Jara - Brenda Pavez
        </p>
    </footer>

</body>
</html>
