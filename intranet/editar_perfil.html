<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Editar Perfil</title>
</head>

<body>
    <header>
        <h1>MovieCali</h1>
        <!-- Logo -->
        <img src="/recursos/imagenes/logo/logo.png" alt="Logo MovieCali">

        <!-- Buscador -->
        <form>
            <input type="text" placeholder="Buscar películas, series...">
            <button>Buscar</button>
        </form>

        <!--Desplegable-->
        <div>
            <a href="./mi_perfil.html">Mi Perfil</a>
            <h3>Gestion pelicula y series</h3>
            <a href="./peliculas_pendientes">Peliculas pendientes de revision</a>
            <a href="./solicitudes_alta">Nuevas solicitudes de alta</a>
            <h3>Administracion de usuarios</h3>
            <a href="./gestion_de_perfil_roles.html">Gestion de perfil y roles</a>
            <a href="./nuevo_perfil.html">Crear nuevo perfil</a>
            <a href="#">Cerrar sesion</a> <!--Link a inicio-->
        </div>
    </header>

    <main>
        <nav><p>GESTIÓN DE PERFILES Y ROLES</p></nav>

        <h2>EDITAR PERFIL</h2>

        <section>
            <!--imagen del perfil que estamos editando-->
            <div>
                <img src="/recursos/imagenes/iconos/perfil.png" alt="=Foto de perfil actual" width="100">
                <button type="button">CAMBIAR FOTO</button>
            </div>
    
            <form>
                <!--Uso de "value" para que los datos ya aparezcan escritos-->
                <div>
                    <label>Nombre:</label>
                    <input type="text" value="Leon">
                </div>
                <div>
                    <label>Apellido:</label>
                    <input type="text" value="Kennedy">
                </div>
                <div>
                    <label>Email:</label>
                    <input type="email" value="lskennedy@gmail.com">
                </div>

                <div>
                    <label>ID:</label>
                    <input type="text" value="85461" readonly> <!--"readonly" para que no se pueda borar el ID-->
                </div>

                <div>
                    <label>Rol:</label>
                    <select>
                        <option selected>ADMINISTRADOR</option><!--Para marcar la opcion actual-->
                        <option>USUARIO</option>
                    </select>
                </div>

                <div>
                    <label>Contraseña:</label>
                    <input type="password" value="**********">
                </div>

                <div>
                    <label>Celular:</label>
                    <input type="tel" value="+549-2705-869344">
                </div>

                <div>
                    <button type="submit">GUARDAR CAMBIOS</button>
                    <button type="button">CANCELAR</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
