<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDITAR PERFIL</title>
    
    <!-- BOOTSTRAP CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="../estilos/estilos_intranet/headerBoostrapIntranet.css">
    <link rel="stylesheet" href="../estilos/body.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/panelBoostrapintranet.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/encabezados.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/peliculasenrevisionBoostrap.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/botonera.css">
    <link rel="stylesheet" href="../estilos/footer.css">
    
    <!--Script-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="../scripts/intranet_scripts/desplegable.js" defer></script>
    <script src="../scripts/intranet_scripts/validacionEditarPerfil.js" defer></script>
    <script src="../scripts/validaciones.js" defer></script>
</head>
<!------------------------------------------------------------------------------------------->
<body onload="asociarValidacion()">
    <!--Header-->
    <header class="header container-fluid py-2">
        <div class="row align-items-center w-100">  
            <!--Logo-->
            <div class="col-lg-3 text-center text-lg-start">
                <img src="../recursos/imagenes/logo/logo.png" alt="Logo MovieCali" class="img-fluid">
            </div>
            <!--Buscador-->
            <div class="col-lg-6 my-2 my-lg-0 d-flex justify-content-center justify-content-lg-start">
                <form class="buscador d-flex w-100" style="max-width: 500px;">
                    <input type="text" class="form-control" placeholder="Buscar películas, series...">
                    <button class="btn btn-primary ms-2">🔍</button>
                </form>
            </div>
            <!--Perfil-->
            <div class="col-lg-3 d-flex justify-content-lg-end justify-content-center mt-2 mt-lg-0">
                <div class="perfil d-flex align-items-center gap-2" id="perfilBtn">
                    <img src="../recursos/imagenes/iconos/usuario.png" alt="usuario">
                    <!--Desplegable-->
                    <div class="desplegable-contenedor">
                        <select name="desplegable" id="desplegable" class="desplegable" onchange="navegarMenu(this)">
                            <option value="" selected disabled> MENU </option>
                            <option value="../intranet/mi_perfil.html">Mi perfil</option>
                            
                            <optgroup label="Gestión de Películas">
                                <option value="../intranet/peliculas_en_revision.html"> Películas pendientes de revisión</option>
                                <option value="../intranet/nuevas_alta_peliculas.html"> Nuevas solicitudes de alta </option>
                            </optgroup> 
                            
                            <optgroup label="Administración Usuarios">
                                <option value="../intranet/gestion_de_perfil_rol.html">Gestión de perfil y roles</option>
                                <option value="../intranet/nuevo_perfil.html">Crear nuevo perfil</option>
                            </optgroup>  
                            
                            <option value="../intranet/inicio_sesion.html">Cerrar Sesión</option>     
                        </select>
                    </div> 
                </div>
            </div>
        </div>
    </header>
<!---------------------------------------------------------------------------------->
    <div class="container-fluid mt-3 px-4">
        <div class="row w-100">
            <div class="col-12 text-start ps-4">
                <a href="../intranet/panel.html" class="boton-panel">
                    <img src="../recursos/imagenes/iconos/Home.png" alt="Inicio" class="icon-home"> PANEL
                </a>
            </div>
        </div>
        <hr class="my-3"> </div>
<!---------------------------------------------------------------------------------->      
    <main class="container my-4 px-3 px-md-5">
        
        
        <div class="categoria-bloque card p-4 shadow border-0" >
            <h3 class="fs-4 fw-bold mb-4 border-bottom pb-2" >EDITAR PERFIL</h3>
            
            <div class="row g-4 align-items-start">
                
                <!-- Sección Izquierda: Cambio de Foto -->
                <div class="col-12 col-md-4 text-center border-end-md border-secondary pb-3 pb-md-0">    
                    <div class="mb-3">
                        <img src="../recursos/imagenes/iconos/perfil.png" alt="Foto de perfil actual" class="img-perfil rounded-circle border border-secondary p-2">
                    </div>
                    <input type="file" id="fotoPerfil" accept="image/*" hidden>
                    <button type="button" class="btn btn-secondary btn-sm px-3" onclick="document.getElementById('fotoPerfil').click();">CAMBIAR FOTO</button>
                </div>   
                
                <!-- Sección Derecha: Formulario de Datos -->
                <div class="col-12 col-md-8">
                    <form id="editar_perfil">
                        <div class="row g-3">

                            <div class="col-md-6">
                                <label for="nombre" class="form-label fw-bold">Nombre:</label>
                                <input type="text" id="nombre" class="form-control bg-dark text-white border-secondary" value="Leon">
                            </div>

                            <div class="col-md-6">
                                <label for="apellido" class="form-label fw-bold">Apellido:</label>
                                <input type="text" id="apellido" class="form-control bg-dark text-white border-secondary" value="Kennedy">
                            </div>

                            <div class="col-md-6">
                                <label for="identificador" class="form-label fw-bold">ID:</label>
                                <input type="text" id="identificador" class="form-control bg-dark text-white border-secondary" value="85461" readonly>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold">Rol:</label>
                                <select class="form-select bg-dark text-white border-secondary">
                                    <option selected>ADMINISTRADOR</option>
                                    <option>USUARIO</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <label for="correo" class="form-label fw-bold">Email:</label>
                                <input type="email" id="correo" class="form-control bg-dark text-white border-secondary" value="lskennedy@gmail.com">
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-bold">Permisos:</label>
                                <select class="form-select bg-dark text-white border-secondary">
                                    <option selected>ADMINISTRADOR</option>
                                    <option>USUARIO</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="contrasenia" class="form-label fw-bold">Contraseña:</label>
                                <input type="password" id="contrasenia" class="form-control bg-dark text-white border-secondary" placeholder="Ingrese la contraseña">
                            </div>

                            <div class="col-md-6">
                                <label for="repetirContrasenia" class="form-label fw-bold">Repetir Contraseña:</label>
                                <input type="password" id="repetirContrasenia" class="form-control bg-dark text-white border-secondary" placeholder="Ingrese nuevamente la contraseña">
                            </div>
                            
                        </div>

                        <!-- BOTONES INFERIORES  -->
                        <div class="botones-inferiores mt-4 pt-3 border-top border-secondary">
                            <div class="d-flex flex-wrap gap-2 justify-content-end">
                                <button type="submit" class="btn btn-primary px-4">GUARDAR CAMBIOS</button>
                                <a href="../intranet/gestion_perfil_rol.html" class="btn btn-outline-light px-4">Cancelar</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
<!-------------FOOTER------------------------------------------------------------------------------>
    <footer class="footer">
        <p class="titulo-footer">Desarrollado por:</p>
        <p class="nombres-footer">Gabriel Mayor - Eliana Salvo - Gabriel Ponce - Alan Walker - Gisella Jara - Brenda Pavez</p>
    </footer>
</body>
</html>
