<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>EDITAR PERFIL</title>
    <link rel="stylesheet" href="../estilos/estilos_intranet/header_intranet.css">
    <link rel="stylesheet" href="../estilos/footer.css">
    <script src="../scripts/intranet_scripts/desplegable.js" defer></script>
</head>

<body>

<!----------------HEADER------------------------------------------------>
    <!-- HEADER -->
    <header class="header">
        <!-- LOGO -->
        <div class="logo">
            <img src="../recursos/imagenes/logo/logo.png"
                alt="Logo MovieCali">
        </div>

        <!-- BUSCADOR -->
        <form class="buscador">
            <input type="text"
                placeholder="Buscar películas, series...">

            <button>🔍</button>
        </form>

        <!-- PERFIL -->
        <div class="perfil" id="perfilBtn">
            <img src="../recursos/imagenes/iconos/usuario.png" alt="usuario">
        <!-- DESPLEGABLE -->
            <div class="desplegable">
                <form>
                    <select name="desplegable" id="desplegable" onchange="navegarMenu(this)">
                        <option value="" selected disabled>Selecciona una opción...</option>
                        <option value="../intranet/mi_perfil.html">Mi perfil</option>
                        <hr>
                        <optgroup label="Gestión de Películas">
                            <option value="../intranet/peliculas_pendientes_de_revision.html">
                                Películas pendientes de revisión
                            </option>
                            <option value="../intranet/nuevas_solicitudes_de_alta_peliculas.html">
                                Nuevas solicitudes de alta
                            </option>
                        </optgroup> 
                        <hr>
                        <optgroup label="Administración Usuarios">
                            <option value="../intranet/gestion_de_perfil_roles.html">
                                Gestión de perfil y roles
                            </option>
                            <option value="../intranet/nuevo_perfil.html">
                                Crear nuevo perfil
                            </option>
                        </optgroup>  
                        <hr>
                        <option value="../intranet/inicio_de_sesion.html">Cerrar Sesión</option>     
                    </select>
                </form>      
            </div> 
        </div>
    </header>
<!----------- FIN DE HEADER--------------------------------------->
    <hr>
    <main>
        <!--PANEL DE ACCESO RÁPIDO-->
        <div>
            <img src="../recursos/imagenes/iconos/Home.png" width="30" height="30" alt="Inicio">
            <a href="../intranet/panel.html">PANEL</a>
        </div>        
        <h2>EDITAR PERFIL</h2>

        <section>
            <div>
                <img src="../recursos/imagenes/iconos/perfil.png" alt="Foto de perfil actual" width="100">
                <button type="button">CAMBIAR FOTO</button>
            </div>
            <form>
                <div>
                    <label>Nombre:</label>
                    <input type="text" value="Leon">
                </div>
                <div>
                    <label>Apellido:</label>
                    <input type="text" value="Kennedy">
                </div>
                <div>
                    <label>Email:</label>
                    <input type="email" value="lskennedy@gmail.com">
                </div>

                <div>
                    <label>ID:</label>
                    <input type="text" value="85461" readonly>
                </div>

                <div>
                    <label>Rol:</label>
                    <select>
                        <option selected>ADMINISTRADOR</option>
                        <option>USUARIO</option>
                    </select>
                </div>

                <div>
                    <label>Contraseña:</label>
                    <input type="password" value="**********">
                </div>

                <div>
                    <label>Celular:</label>
                    <input type="tel" value="+549-2705-869344">
                </div>

                <div>
                    <button type="submit">GUARDAR CAMBIOS</button>
                    <a href="../intranet/gestion_de_perfil_roles.html">Cancelar</a>
                </div>
            </form>
        </section>
    </main>

    <br><br>

    <!-- -------------FOOTER------------------>
    <!-- FOOTER -->
    <footer class="footer">

        <p class="titulo-footer">
            Desarrollado por:
        </p>

        <p class="nombres-footer">
            Gabriel Mayor - Eliana Salvo - Gabriel Ponce -
            Alan Walker - Gisella Jara - Brenda Pavez
        </p>

    </footer>

</body>
</html>
