<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>ELIMINAR PERFIL</title>
    <!-- Mantenemos tus estilos locales e incorporamos la hoja de tarjetas de tu compañera -->
    <link rel="stylesheet" href="../estilos/estilos_intranet/header_intranet.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/body_intranet.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/panel_intranet.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/tarjetas_paralelas.css">
    <link rel="stylesheet" href="../estilos/estilos_intranet/botones.css">
    <link rel="stylesheet" href="../estilos/footer.css">
    <script src="../scripts/intranet_scripts/desplegable.js" defer></script>

    <script>
        
        function confirmarEliminacionPerfil(){
            const confirmar = confirm("¿Está seguro que desea eliminar este perfil?");
            
            if(confirmar){
                alert("Perfil eliminado correctamente");
                window.location.href = "../intranet/gestion_de_perfil_roles.html";
            }
        }
    </script>
</head>

<body>

    <!-- HEADER COMPARTIDO -->
    <header class="header">
        <div class="logo">
            <img src="../recursos/imagenes/logo/logo.png" alt="Logo MovieCali">
        </div>

        <form class="buscador">
            <input type="text" placeholder="Buscar películas, series...">
            <button>🔍</button>
        </form>

        <div class="perfil" id="perfilBtn">
            <img src="../recursos/imagenes/iconos/usuario.png" alt="usuario">
            <div class="desplegable">
                <form>
                    <select name="desplegable" id="desplegable" onchange="navegarMenu(this)">
                        <option value="" selected disabled>Selecciona una opción...</option>
                        <option value="../intranet/mi_perfil.html">Mi perfil</option>
                        <hr>
                        <optgroup label="Gestión de Películas">
                            <option value="../intranet/peliculas_pendientes_de_revision.html">Películas pendientes de revisión</option>
                            <option value="../intranet/nuevas_solicitudes_de_alta_peliculas.html">Nuevas solicitudes de alta</option>
                        </optgroup> 
                        <hr>
                        <optgroup label="Administración Usuarios">
                            <option value="../intranet/gestion_de_perfil_roles.html">Gestión de perfil y roles</option>
                            <option value="../intranet/nuevo_perfil.html">Crear nuevo perfil</option>
                        </optgroup>  
                        <hr>
                        <option value="../intranet/inicio_de_sesion.html">Cerrar Sesión</option>     
                    </select>
                </form>      
            </div> 
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main">
        <div class="contenedor-panel">
            <div class="Panel">
                <img src="../recursos/imagenes/iconos/Home.png" alt="Inicio" width="30" height="30">
                <a href="../intranet/panel.html">PANEL</a>
            </div>
        </div>

        <!-- Contenedor para centrar la tarjeta flotante en la pantalla -->
        <div class="contenedor-tarjetas">
            
            <!-- Adoptamos la clase Tarjeta para heredar el fondo azul y el sombreado de la captura -->
            <section class="Tarjeta">
                <h3>ELIMINAR PERFIL</h3>
                <p>¿Seguro que desea eliminar este Perfil?</p>

                <!-- Imagen del usuario centrada como el icono de la claqueta -->
                <img src="../recursos/imagenes/iconos/perfil.png" alt="Foto de perfil" width="100" height="100">

                <!-- Bloque de datos -->
                <div style="text-align: left; margin: 20px auto; width: fit-content; line-height: 1.6; font-size: 0.95rem;">
                    <p><strong>NOMBRE:</strong> Usuario_123</p>
                    <p><strong>ID:</strong> 85461</p>
                    <p><strong>ROL:</strong> ADMINISTRATIVO</p>
                    <p><strong>EMAIL:</strong> imdonf@gmail.com</p>
                    <p><strong>PERMISOS:</strong> ADMINISTRADOR</p>
                </div>

                <div class="botones-inferiores">
                    <div class="guardar_accion">
                        <button type="button" class="btn-gris" style="width: 120px;" onclick="confirmarEliminacionPerfil()">ELIMINAR</button>
                    </div>
                    <div class="modificables">
                        <a href="../intranet/gestion_de_perfil_roles.html" class="btn-gris" style="width: 120px;">CANCELAR</a>
                    </div>
                </div>
            </section>
            
        </div>
    </main>

  <!-- -------------FOOTER------------------>
    <!-- FOOTER -->
    <footer class="footer">
        <p class="titulo-footer">Desarrollado por:</p>
        <p class="nombres-footer">
            Gabriel Mayor - Eliana Salvo - Gabriel Ponce - Alan Walker - Gisella Jara - Brenda Pavez
        </p>
    </footer>

</body>
</html>
