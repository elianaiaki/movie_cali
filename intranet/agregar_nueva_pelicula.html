<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>AGREGAR NUEVA PELICULA</title>
</head>

<body>
  
<!------------------------------------------------------------------------------------------->
 <!-- HEADER -->
    <header>
        <h1>MovieCali</h1>
        <!-- Logo -->
        <img src="../recursos/imagenes/logo/logo.png" alt="Logo MovieCali" width="500" height="260">

        <!-- Buscador -->
        <form>
            <input type="text" placeholder="Buscar películas, series...">
            <button>Buscar</button>
        </form>
        <!-- Navegación Desplegable -->
        <nav>
            <form>
                <label for="Desplegable">Desplegable</label>
                    <select name="desplegable" id="desplegable">
                        <option href="../intranet/mi_perfil.html">Mi perfil</option>
                        <optgroup label="Gestion de Peliculas">
                            <option value="peliculas_pendientes" href="../intranet/peliculas_pendientes_de_revision.html">
                                Pelicula pendientes de revision
                            </option>
                            <option label="nuevas_solicitudes_de_alta" href="../intranet/nuevas_solicitudes_de_alta_peliculas.html">
                                Nuevas solicitudes de alta peliculas
                            </option>
                        </optgroup> 
                        <optgroup label="administracion_usuarios">
                            <option label="gestion_perfiles" href="../intranet/gestion_de_perfil_roles.html">
                                Gestion de perfil y roles
                            </option>
                            <option label="nuevo_perfil_intranet" href="../intranet/nuevo_perfil.html">
                                Crear nuevo perfil
                            </option>
                        </optgroup>  
                        <option label="cerrar_sesion" href="../intranet/inicio_de_sesion.html">Cerrar Sesion</option>     

                    </select>
            </form>
        </nav>
    </header>

    <br>
<!-- FIN DE HEADER-->

    <main>
        <!------------------------------------------------------------------------------------------->
        <!-- PANEL -->
        <div>
            <table border="1">
                <tr>
                    <td align="center">
                        <img src="../recursos/imagenes/iconos/Home.png" width="30" height="30">
                        <a href="../intranet/panel.html">PANEL</a>
                    </td>
                </tr>
            </table>
        </div>
        <br>
        <!------------------------------------------------------------------------------------------->
    
        <div>
            <h1>+ AGREGAR NUEVA PELICULA</h1>

            <table border="1" width="92%" align="center">
                <tr>
                    <td width="100%">
                        <p>   </p>
                    </td>
                </tr>
                <tr>    
                    <td>
                        <p>Agregar Pelicula</p>
                        <form>
                            <label for="Titulo_pelicula">Titulo: </label>
                            <input type="text" placeholder="EL Diablo Viste a la Moda 2">
                            <label for="Genero_pelicula">Genero: </label>
                            <input type="text" placeholder="Comedia Dramatica">
                            <label for="Año_estreno">Año de Estreno: </label>
                            <input type="text" placeholder="20 de Abril 2026">
                            <label for="Duracion_pelicula">Duración: </label>
                            <input type="text" placeholder="1h 59min"><br>
                            <label for="Director">Director </label>
                            <input type="text" placeholder="David Frankel">
                            <label for="Productor_pelicula">Productor: </label>
                            <input type="text" placeholder="Ingrese nombre y apellido">
                            <label for="Calificacion_pelicula">Calificacion General: </label>
                            <input type="text" placeholder="8.5 / 10">
                            <label for="Plataformas_disponibles">Plataformas: </label>
                            <input type="text" placeholder="Agregar imagen"><br>
                            <label for="clasificacion_edad">Clasificacion por Edad: </label>
                            <input type="text" placeholder="+18">
                            <label for="Reparto">Reparto: </label>
                            <select name="reparto">
                                <optgroup label="Listados">
                                    <option value="Anne_Hathaway"> Anne Hathaway</option>
                                </optgroup>
                                <input type="text" placeholder="Agregar nuevos actores">
                            </select> <br>
                            <label for="sinopsis_peli">Sinopsis: </label><br>
                            <textarea id="sinopsis" name="sinopsis_peli" rows="4" cols="100">
                                Escribe aquí el resumen de la trama..
                            </textarea> <br>
                            <label for="video-upload">Trailer:</label>
                            <input type="file" id="video-upload" name="video_numero" accept="video/*" required>
                            <button type="submit">Subir Trailer</button><br>              
                            <label for="Poster">Cargar Poster: </label>
                            <input type="file" id="Poster" name="poster_image" accept="image/*" required>
                            <button type="submit">Examinar</button><br>
                            <br>
                            <button type="submit">Guardar Cambios</button> 
                            <a href="../intranet/peliculas_pendientes_de_revision.html">Cancelar</a> <!--BOTON-->
                       
                        </form>
                    </td>
                </tr>
            </table>
        </div>
    </main>

    <br>
    <br>
