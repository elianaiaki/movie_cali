<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>INICIAR SESIÓN - Internet</title>
    <link rel="stylesheet" href="../estilos/body.css">
    <link rel="stylesheet" href="../estilos/header.css">
    <link rel="stylesheet" href="../estilos/estilo_internet/inicioInternet.css">
    <link rel="stylesheet" href="../estilos/footer.css">
    
    <script src="../scripts/validaciones.js"></script>

    <script src="../scripts/inicioSesionInternet.js"></script>
</head>

<body class="body" onload="asociarValidacion()">
     <!-- HEADER -->
    <header class="header">
        <!-- LOGO -->
        <div class="logo">
            <img src="../recursos/imagenes/logo/logo.png"
                alt="Logo MovieCali">
        </div>

        <!-- BUSCADOR -->
        <form class="buscador">
            <input type="text"
                placeholder="Buscar películas, series...">

            <button>🔍</button>
        </form>

        <!-- NAVEGACIÓN -->
        <nav class="menu">
            <a href="../index.html">Inicio</a>
            <a href="../internet/catalogo_peliculas.html">Películas</a>
            <a href="../internet/catalogo_series.html">Series</a>
        </nav>

        <!-- usuario registrado-->
        <!-- PERFIL -->
        <div class="perfil" id="perfilBtn">
            <img src="../recursos/imagenes/iconos/usuario.png" alt="usuario">

            <div class="perfil-info">
                <span>MENU</span>
                <span class="flecha">▼</span>
            </div>

            <div class="dropdown">
                <a href="../internet/iniciar_sesion.html"><span class="icono-dropdown">▶</span>INICIAR SESION</a>
                <a href="./crear_cuenta.html"><span class="icono-dropdown">▶</span> CREAR CUENTA</a>
            </div>
        </div>

    </header>
    <hr>
    
    <main class="diseno-login"> 
        <section class="card-inicio">
            <h2>INICIO DE SESIÓN</h2>
            <form id="inicio_de_sesion" action="../extranet/index_usser.html" method="get">

                <div class="form-group">
                    <label>USUARIO / CORREO ELECTRÓNICO</label>
                    <div class="input-contenedor">
                        <img src="../recursos/imagenes/iconos/usuario.png" alt="icono usuario">
                        <input id="usuario" name="usuario" type="text" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>CONTRASEÑA</label>
                    <div class="input-contenedor">
                        <img src="../recursos/imagenes/iconos/contraseña.webp" alt="icono contraseña">
                        <input id="contrasenia" name="contrasenia" type="password" required>
                        <img src="../recursos/imagenes/iconos/mostrar_contraseña.png" alt="ver">
                    </div>
                </div>
                
                <div class="contenedor-enlace">
                    <a href="../intranet/recuperar_contraseña.html" class="enlace">¿OLVIDASTE TU CONTRASEÑA?</a>
                </div>
                
                <div class="contenedor-boton">
                    <button type="submit" class="boton-inicio">INICIAR SESIÓN</button>
                </div>

                <div class="contenedor-boton">
                    <button type="button" class="boton-google">
                        <img src="../recursos/imagenes/iconos/google-icon-1.png" alt="icono google"> CONTINUAR CON GOOGLE
                    </button>
                </div>

                <div class="contenedor-enlace registro">
                    <a href="./crear_cuenta.html" class="enlace">¿NO TIENES CUENTA? REGÍSTRATE</a>
                </div>

            </form>
        </section>
    </main>

    <footer class="footer">
        <p class="titulo-footer">Desarrollado por:</p>
        <p class="nombres-footer">
            Gabriel Mayor - Eliana Salvo - Gabriel Ponce - Alan Walker - Gisella Jara - Brenda Pavez
        </p>
    </footer>
</body>
</html>
