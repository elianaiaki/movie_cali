<!DOCTYPE html>
<html lang="es">

    <head>
        <meta charset="UTF-8">
        <title>INICIAR SESIÓN - Internet</title>
        <!-- HOJAS DE ESTILO -->
        <link rel="stylesheet" href="../estilos/body.css">
        <link rel="stylesheet" href="../estilos/headerBoostrap.css">
        <link rel="stylesheet" href="../estilos/estilo_internet/inicioInternet.css">
        <link rel="stylesheet" href="../estilos/footer.css">
        <!-- SCRIPTS -->
        <script src="../scripts/header.js" defer></script>
        <script src="../scripts/validaciones.js"></script>
        <script src="../scripts/inicioSesionInternet.js"></script>
        <!-- BOOTSTRAP -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </head>

    <body class="body" onload="asociarValidacion()">
        <!-- HEADER -->
        <header class="header container-fluid py-2">
            <div class="row align-items-center w-100">
                <!-- LOGO -->
                <div class="col-lg-3 text-center text-lg-start">
                    <img src="../recursos/imagenes/logo/logo.png"
                        alt="Logo MovieCali"
                        class="img-fluid">
                </div>

                <!-- BUSCADOR -->
                <div class="col-lg-3 my-2 my-lg-0">
                    <form class="buscador d-flex">
                        <input type="text"
                            class="form-control"
                            placeholder="Buscar películas, series...">
                        <button class="btn btn-primary ms-2">
                            🔍
                        </button>
                    </form>
                </div>

                <!-- MENÚ -->
                <nav class="col-lg-3">
                    <div class="d-flex justify-content-center gap-3">
                        <a href="../index.html" class="btn btn-outline-light">Inicio</a>
                        <a href="../internet/catalogo_peliculas.html" class="btn btn-outline-light">Películas</a>
                        <a href="../internet/catalogo_series.html" class="btn btn-outline-light">Series</a>
                    </div>
                </nav>

                <!-- PERFIL -->
                <div class="col-lg-3 d-flex justify-content-lg-end justify-content-center mt-2 mt-lg-0">
                    <div class="perfil" id="perfilBtn">

                        <img src="../recursos/imagenes/iconos/usuario.png"
                            alt="usuario">

                        <div class="perfil-info">
                            <span>MENU</span>
                            <span class="flecha">▼</span>
                        </div>

                        <div class="menu-perfil">
                            <a href="../internet/inicioSesion.html"><span class="icono-dropdown">▶</span>INICIAR SESION</a>
                            <a href="./crear_cuenta.html"><span class="icono-dropdown">▶</span> CREAR CUENTA</a>
                        </div>

                    </div>
                </div>

            </div>
        </header>
        <hr>
        
        <main class="diseno-login container">
            <div class="row justify-content-center w-100">
                <div class="col-12 col-sm-10 col-md-7 col-lg-5">
                    <!-- FORMULARIO DE INICIO DE SESION -->
                    <section class="card-inicio">
                        <h2>INICIO DE SESIÓN</h2>
                        <form id="inicio_de_sesion" action="../extranet/index_usser.html" method="get">
                            <!-- Usuario -->
                            <div class="form-group">
                                <label>USUARIO / CORREO ELECTRÓNICO</label>
                                <div class="input-contenedor">
                                    <img src="../recursos/imagenes/iconos/usuario.png" alt="icono usuario">
                                    <input id="usuario" name="usuario" type="text" required>
                                </div>
                            </div>

                            <!-- Contraseña -->
                            <div class="form-group">
                                <label>CONTRASEÑA</label>
                                <div class="input-contenedor">
                                    <img src="../recursos/imagenes/iconos/contraseña.webp" alt="icono contraseña">
                                    <input id="contrasenia" name="contrasenia" type="password" required>
                                    <img src="../recursos/imagenes/iconos/mostrar_contraseña.png" alt="ver">
                                </div>
                            </div>

                            <!-- Olvidaste contraseña -->
                            <div class="contenedor-enlace">
                                <a href="../intranet/recuperar_contraseña.html" class="enlace">
                                    ¿OLVIDASTE TU CONTRASEÑA?
                                </a>
                            </div>

                            <!-- Botón login -->
                            <div class="contenedor-boton">
                                <button type="submit" class="boton-inicio">
                                    INICIAR SESIÓN
                                </button>
                            </div>

                            <!-- Google -->
                            <div class="contenedor-boton">
                                <button type="button" class="boton-google">
                                    <img src="../recursos/imagenes/iconos/google-icon-1.png" alt="google">
                                    CONTINUAR CON GOOGLE
                                </button>
                            </div>

                            <!-- Registro -->
                            <div class="contenedor-enlace registro">
                                <a href="./crear_cuenta.html" class="enlace">
                                    ¿NO TIENES CUENTA? REGÍSTRATE
                                </a>
                            </div>
                        </form>
                    </section>
                </div>
            </div>
        </main>

        <!-- FOOTER -->
        <footer class="footer">
            <p class="titulo-footer">Desarrollado por:</p>
            <p class="nombres-footer">Gabriel Mayor - Eliana Salvo - Gabriel Ponce -Alan Walker - Gisella Jara - Brenda Pavez</p>
        </footer>
    </body>
</html>
