<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesion</title>
     <link rel="stylesheet" href="../estilos/body.css">
    <link rel="stylesheet" href="../estilos/headerBoostrap.css">
    <link rel="stylesheet" href="../estilos/footer.css">
    <link rel="stylesheet" href="../estilos/estilo_internet/catalogo.css">
    <script src="../scripts/header.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
     <header class="header container-fluid py-2">
        <div class="row align-items-center w-100">
            <!-- LOGO -->
            <div class="col-lg-3 text-center text-lg-start">
                <img src="../recursos/imagenes/logo/logo.png"
                    alt="Logo MovieCali"
                    class="img-fluid">
            </div>

            <!-- BUSCADOR -->
            <div class="col-lg-3 my-2 my-lg-0">
                <form class="buscador d-flex">
                    <input type="text"
                        class="form-control"
                        placeholder="Buscar películas, series...">
                    <button class="btn btn-primary ms-2">
                        🔍
                    </button>
                </form>
            </div>

            <!-- MENÚ -->
            <nav class="col-lg-3">
                <div class="d-flex justify-content-center gap-3">
                    <a href="../index.html" class="btn btn-outline-light">Inicio</a>
                    <a href="../internet/catalogo_peliculas.html" class="btn btn-outline-light">Películas</a>
                    <a href="../internet/catalogo_series.html" class="btn btn-outline-light">Series</a>
                </div>
            </nav>

            <!-- PERFIL -->
            <div class="col-lg-3 d-flex justify-content-lg-end justify-content-center mt-2 mt-lg-0">
                <div class="perfil" id="perfilBtn">

                    <img src="../recursos/imagenes/iconos/usuario.png"
                        alt="usuario">

                    <div class="perfil-info">
                        <span>MENU</span>
                        <span class="flecha">▼</span>
                    </div>

                    <div class="menu-perfil">
                        <a href="../internet/inicioSesion.html"><span class="icono-dropdown">▶</span>INICIAR SESION</a>
                        <a href="./crear_cuenta.html"><span class="icono-dropdown">▶</span> CREAR CUENTA</a>
                    </div>

                </div>
            </div>

        </div>
    </header>

    <hr>
    <!-- FIN DE HEADER-->
 
    <section>

        <h1>INICIO DE SESION</h1>

        <form action="../extranet/mi_perfil.html" method="get">
            <!-- Usuario -->
            <div>
                <label>USUARIO / CORREO ELECTRONICO</label><br>
                <img src="../recursos/imagenes/iconos/usuario.png" alt="icono usuario" width="20" height="20">
                <input type="text">
            </div>
            <!-- Contraseña -->
            <div>
                <label>CONTRASEÑA</label><br>
                <img src="../recursos/imagenes/iconos/contraseña.webp" alt="icono contraseña" width="20" height="20">
                <input type="password">
                <img src="../recursos/imagenes/iconos/mostrar_contraseña.png" alt="mostrar contraseña" width="20" height="20">
            </div>
            <!-- Olvidaste contraseña -->
            <div>
                <a href="#">¿OLVIDASTE TU CONTRASEÑA?</a>
            </div>
            <!-- login -->
            <div>
                <button type="submit">INICIAR SESION</button>
            </div>
            <!-- google -->
            <div>
                <button type="button">
                    <img src="../recursos/imagenes/iconos/google-icon-1.png" alt="icono google" width="20" height="20"> CONTINUAR CON GOOGLE
                </button>
            </div>
            <!-- Registro -->
            <div>
                <a href="./crear_cuenta.html">NO TIENES CUENTA? REGISTRATE</a>
            </div>
        </form>

    </section>

  <!-- FOOTER -->
    <footer>
        <p>Desarrollado por: Gabriel Mayor · Eliana Salvo · Gabriel Ponce · Alan Walker · Gisella Jara · Brenda Pavez</p>
        <p>2026 MovieCali. Todos los derechos reservados.</p>
    </footer>
 
</body>
</html>
