<body>

        <h1>MovieCali</h1>
        <!-- Logo -->

        <!-- Buscador -->

            <input type="text" placeholder="Buscar películas, series...">

                <img src="icon-lock.png" alt="icono contraseña">

            <!-- google -->

                    <img src="icon-google.png" alt="icono google"> CONTINUAR CON GOOGLE

            </div>
