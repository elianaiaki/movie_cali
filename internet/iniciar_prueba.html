<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesion</title>
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>MovieCali</h1>
        <!-- Logo -->
        <img src="../recursos/imagenes/logo/logo.png" alt="Logo MovieCali" width="500" height="260">

        <!-- Buscador -->
        <form>
            <input type="text" placeholder="Buscar películas, series...">
            <button>Buscar</button>
        </form>

        <!-- Navegación -->
        <nav>
            <a href="../index.html">Inicio</a>
            <a href="./catalogo_peliculas.html">Películas</a>
            <a href="./catalogo_series.html">Series</a>
        </nav>

        <!-- Usuario -->
        <div>
            <a href="#">Iniciar sesión</a>
            <a href="./crear_cuenta.html">Crear cuenta</a>
        </div>
    </header>

    <hr>
    <!-- FIN HEADER -->

    <section>

        <h1>INICIO DE SESION</h1>

        <!-- <form action="../extranet/mi_perfil.html" method="get"> -->
        <form id="iniciar_sesion"action="../extranet/mi_perfil.html" method="get">
            <!-- Usuario -->
            <div>
                <label>USUARIO / CORREO ELECTRONICO</label><br>
                <img src="../recursos/imagenes/iconos/usuario.png" alt="icono usuario" width="20" height="20">
                <input type="text" id="usuario">
            </div>
            <!-- Contraseña -->
            <div>
                <label>CONTRASEÑA</label><br>
                <img src="../recursos/imagenes/iconos/contraseña.webp" alt="icono contraseña" width="20" height="20">
                <input type="password" id="contrasenia">
                <img src="../recursos/imagenes/iconos/mostrar_contraseña.png" alt="mostrar contraseña" width="20" height="20">
            </div>
            <!-- Olvidaste contraseña -->
            <div>
                <a href="#">¿OLVIDASTE TU CONTRASEÑA?</a>
            </div>
            <!-- login -->
            <div>
                <button type="submit">INICIAR SESION</button>
            </div>
            <!-- google -->
            <div>
                <button type="button">
                    <img src="../recursos/imagenes/iconos/google-icon-1.png" alt="icono google" width="20" height="20"> CONTINUAR CON GOOGLE
                </button>
            </div>
            <!-- Registro -->
            <div>
                <a href="./crear_cuenta.html">NO TIENES CUENTA? REGISTRATE</a>
            </div>
        </form>

    </section>

    <!-- FOOTER -->
    <footer>
        <p>Desarrollado por: Gabriel Mayor · Eliana Salvo · Gabriel Ponce · Alan Walker · Gisella Jara · Brenda Pavez</p>
        <p>2026 MovieCali. Todos los derechos reservados.</p>
    </footer>

        <!-- CONEXION CON JS -->
    <script src="../scripts/validaciones.js"></script>

    <script>

        // Obtener formulario
        const formulario = document.getElementById("iniciar_sesion");

        // Evento submit
        formulario.addEventListener("submit", function(event){

            // Frenar envío automático
            event.preventDefault();

            // Obtener valores
            const usuario = document.getElementById("usuario").value;

            const contrasenia = document.getElementById("contrasenia").value;

            // Validar usuario o correo
            if(
                !usuarioValido(usuario) &&
                !correoValido(usuario)
            ){

                alert("Usuario o correo inválido");

                return;
            }

            // Validar contraseña
            if(
                !contraseniaValida(contrasenia)
            ){

                alert("Contraseña inválida");

                return;
            }

            // Si todo está bien
            alert("Inicio de sesión correcto");

            // Enviar formulario manualmente
            formulario.submit();

        });

    </script>

    </body>
    </html>
